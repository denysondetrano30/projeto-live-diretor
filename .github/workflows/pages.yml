# Publica o app do Diretor no GitHub Pages a cada envio (Settings › Pages › Source: GitHub Actions).
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Junta os arquivos do site
        run: mkdir site && cp -r index.html firebase-config.js relatar.js cam site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # O GitHub às vezes ainda não "enxerga" o pacote logo depois de enviado (erro "No artifacts named
      # github-pages"); uma pequena espera resolve.
      - name: Espera o pacote aparecer
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
