<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto Live — Diretor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141418; --panel:#1d1d23; --panel2:#23232b; --line:#2a2a33; --line2:#3a3a46;
  --text:#ececf1; --muted:#a3a3ad; --blue:#3b6fe0; --blueSoft:#1f3566; --blueText:#dbe6ff;
  --amber:#e8a33d; --green:#3ecf72; --red:#e5574d; --sel:#4c6fd1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:1.5px;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:12px}
.cols{display:grid;grid-template-columns:260px 1fr 360px;flex:1;min-height:0}
.col{min-height:0;overflow:auto}
nav.cultos{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.btn{background:var(--line);color:var(--text);border:0;border-radius:8px;padding:0 14px;min-height:40px;font-weight:600}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#4a7cf0}
.btn.primary:disabled{background:#2a3350;color:#8b93ad;cursor:default}
.btn.ghost{background:transparent;border:1px dashed var(--line2);color:var(--muted);font-weight:500}
.btn.ghost:hover{color:var(--text);border-color:#55556a}
.btn.link{background:transparent;color:var(--muted);font-weight:500;padding:0 6px}
.btn.link:hover{color:var(--text)}
.month{color:var(--muted);font-size:11px;letter-spacing:.6px;margin:14px 6px 4px;text-transform:uppercase}
.culto{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 11px}
.culto:hover{background:var(--panel)}
.culto.on{background:var(--panel2);border-color:var(--line2)}
.culto .t{font-weight:600}
.culto .s{color:var(--muted);font-size:12px;margin-top:2px}
main.roteiro{padding:20px 26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.titleIn{background:transparent;border:1px solid transparent;border-radius:8px;font-size:22px;font-weight:700;padding:4px 6px;margin-left:-7px;width:100%}
.titleIn:hover{border-color:var(--line)}
.titleIn:focus{outline:none;border-color:var(--sel);background:var(--panel)}
.when{display:flex;gap:8px;align-items:center;margin-top:4px}
.when input{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;color-scheme:dark}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.hint{color:var(--muted);font-size:12px;letter-spacing:.3px}
ol.itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:20px 24px 22px 1fr auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;user-select:none}
.item:hover{border-color:var(--line2)}
.item.on{background:var(--panel2);border-color:var(--sel)}
.item.dragging{opacity:.35}
.item.dropBefore{box-shadow:0 -3px 0 var(--sel)}
.item.dropAfter{box-shadow:0 3px 0 var(--sel)}
.grip{color:#6b6b78;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;height:28px}
.num{color:var(--muted);text-align:right}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{color:var(--muted);font-size:12px}
.chip{border-radius:6px;padding:4px 9px;font-size:12px;white-space:nowrap;background:var(--line);color:var(--text)}
.chip.letra{background:var(--blueSoft);color:var(--blueText)}
.chip.midia{background:#3a2a14;color:#f2dfb0}
.warnTxt{color:#f2dfb0}
aside.editor{border-left:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sel)}
.field textarea{min-height:220px;resize:vertical;line-height:1.55}
.msg{font-size:12px;line-height:1.45}
.ok{color:#b8f0cd}.bad{color:#ffb4ad}.warn{color:#f2dfb0}
.empty{color:var(--muted);text-align:center;padding:40px 16px;line-height:1.6}
.menu{position:fixed;z-index:50;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:9px 12px;min-height:38px}
.menu button:hover{background:var(--line)}
.menu button.danger{color:#ffb4ad}
.menu hr{border:0;border-top:1px solid var(--line2);margin:5px 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 16px;z-index:60;max-width:min(520px,90vw);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.dialogBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.dialog .row{display:flex;gap:10px;justify-content:flex-end}
.back{display:none}
@media (max-width: 900px){
  .cols{display:block;overflow:auto}
  .app .col{display:none;overflow:visible}
  .app[data-view="cultos"] nav.cultos{display:flex}
  .app[data-view="roteiro"] main.roteiro{display:flex}
  .app[data-view="item"] aside.editor{display:flex}
  nav.cultos,aside.editor{border:0}
  main.roteiro{padding:16px 14px 90px}
  aside.editor{padding:16px 14px 40px}
  .back{display:inline-flex;align-items:center}
  .item{grid-template-columns:20px 22px 1fr;grid-template-rows:auto auto}
  .item .icon{display:none}
  .item .chip{grid-column:3;justify-self:start}
  .pubBar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px 16px;display:flex;gap:10px;z-index:20}
  .pubBar .btn{min-height:48px;flex:1}
  .headPub{display:none}
}
@media (min-width: 901px){ .pubBar{display:none} }
/* Banco de músicas */
.busca{position:relative}
.bRes{display:flex;flex-direction:column;gap:2px;margin-top:6px;max-height:340px;overflow:auto}
.bRes .sec{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:8px 2px 4px}
.bRes .r{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;text-align:left;background:none;border:0;color:inherit;width:100%}
.bRes .r:hover,.bRes .r:focus{background:var(--panel2)}
.capa{width:44px;height:44px;border-radius:6px;flex:0 0 auto;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.bRes .t{font-weight:600}
.bRes .a,.bRes .l{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bRes mark{background:rgba(255,214,0,.35);color:inherit;border-radius:2px}
.escolhida{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px}
.escolhida .capa{width:64px;height:64px}
.previa{white-space:pre-wrap;font-size:13px;line-height:1.45;color:var(--muted);max-height:240px;overflow:auto;margin-top:6px}
/* Ao vivo */
.live{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;overflow:auto}
.live .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.live .bar .t{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .pulse{width:8px;height:8px;border-radius:4px;background:var(--red);box-shadow:0 0 0 4px rgba(229,87,77,.2)}
.live .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;max-width:1100px;width:100%;margin:0 auto}
.live .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.live .lbl{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.live .agora .big{font-size:22px;font-weight:700;line-height:1.25}
.live .agora .next{color:var(--muted);font-size:13px}
.live .chips{display:flex;flex-wrap:wrap;gap:8px}
.live .chips button{background:var(--line);border:0;border-radius:18px;padding:0 14px;min-height:38px;font-weight:600}
.live .chips button.on{background:var(--blue);color:#fff}
.live .chips button.resp{background:var(--panel2);border:1px solid var(--line2)}
.live .send{display:flex;gap:8px}
.live .send input,.live .field input,.live .field select{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
.live .thread{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.live .m{background:var(--panel2);border-radius:10px;padding:8px 11px;max-width:88%;line-height:1.4}
.live .m.eu{align-self:flex-end;background:var(--blueSoft);color:var(--blueText)}
.live .m .w{font-size:11px;opacity:.7;margin-bottom:2px}
.live .sug{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.live .full{grid-column:1/-1}
@media (max-width: 900px){ .live .wrap{grid-template-columns:1fr;padding:12px} }
</style>
</head>
<body>
<!-- Configuração do Firebase (só existe na página publicada no site; sem ela, modo de teste). -->
<script src="firebase-config.js"></script>
<div class="app" id="app" data-view="cultos">
  <header class="top">
    <div class="brand">PROJETO LIVE</div>
    <div class="muted small">Diretor</div>
    <div style="flex:1"></div>
    <div class="muted small" id="modeNote">Modo de teste: os dados ficam só neste navegador</div>
    <button class="btn link small" id="sair" style="display:none">Sair</button>
  </header>
  <div id="login" style="display:none;flex:1;align-items:center;justify-content:center;padding:20px">
    <form id="loginForm" class="dialog" style="max-width:360px">
      <div style="font-weight:700;font-size:18px">Entrar</div>
      <div class="muted small">Conta do Projeto Live da sua igreja.</div>
      <div class="field"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" required></div>
      <div class="msg bad" id="lErro"></div>
      <button class="btn primary" type="submit" style="min-height:44px">Entrar</button>
    </form>
  </div>
  <div class="cols">
    <nav class="col cultos" id="cultos" aria-label="Cultos"></nav>
    <main class="col roteiro" id="roteiro"></main>
    <aside class="col editor" id="editor" aria-label="Item escolhido"></aside>
  </div>
  <section class="live" id="aovivo" style="display:none" aria-label="Culto ao vivo"></section>
</div>

<script>
(function(){
'use strict';

/* ---------------------------------------------------------------------------
 * Projeto Live — app do Diretor (fase de testes, sem servidor).
 *
 * O diretor monta o culto: nome, data, hora e o roteiro (músicas, leituras,
 * imagens e vídeos), com o destino de cada item (Só telão / Telão + letra na
 * live / Telão + imagem e som na live). Imagens e vídeos são links do Google
 * Drive. "Publicar" guarda uma versão numerada (v1, v2...).
 *
 * Nesta fase os dados ficam no navegador (localStorage). O formato já é o que
 * vai para o Firebase (Firestore): um documento por culto, com os itens e as
 * versões publicadas. Trocar o "store" abaixo é o que liga o app no Firebase.
 * ------------------------------------------------------------------------- */

var KEY = 'projeto-live-diretor-v1';

var TIPOS = {
  musica: {nome: 'Música', destinos: ['letra', 'telao']},
  texto:  {nome: 'Leitura ou texto', destinos: ['letra', 'telao']},
  imagem: {nome: 'Imagem', destinos: ['telao', 'midia']},
  video:  {nome: 'Vídeo', destinos: ['midia', 'telao']}
};
var DESTINOS = {
  telao: {longo: 'Só telão', curto: 'Só telão'},
  letra: {longo: 'Telão + letra na live', curto: 'Letra na live'},
  midia: {longo: 'Telão + imagem e som na live', curto: 'Imagem e som na live'}
};
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
var ICONES = {
  musica: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3ad" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  texto:  '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3ad" stroke-width="1.8"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/></svg>',
  imagem: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3ad" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  video:  '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3ad" stroke-width="1.8"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2"/></svg>'
};
var GRIP = '<svg aria-hidden="true" width="12" height="18" viewBox="0 0 12 18" fill="#6b6b78"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg>';

/* ---------------- dados ---------------- */

var memoria = null; /* se o navegador não deixar guardar, fica só na memória */
var store = {
  load: function(){
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return memoria || {cultos: []};
  },
  save: function(data){
    memoria = data;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {
      document.getElementById('modeNote').textContent = 'Este navegador não deixa guardar: os dados somem ao fechar';
    }
  }
};

var db = store.load();
var ui = {cultoId: null, itemId: null, view: 'cultos'};
try { var lembrado = JSON.parse(localStorage.getItem(KEY + '-ui') || 'null'); if (lembrado) { ui.cultoId = lembrado.cultoId; } } catch (e) {}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function salvar(){
  store.save(db);
  try { localStorage.setItem(KEY + '-ui', JSON.stringify({cultoId: ui.cultoId})); } catch (e) {}
  if (nuvem.user && ui.cultoId) nuvem.agendar(ui.cultoId);
}

/* ---------------- conta (Firebase) ----------------
 * Com o arquivo firebase-config.js (só na página publicada no site), o app pede login e guarda
 * os cultos no Firestore, coleção "cultos", um documento por culto (dono = a conta). A última
 * versão publicada vai inteira no campo "ultima", que é o que a Projeção lê; o histórico das
 * versões fica em cultos/<id>/versoes/<n>. Sem o arquivo, segue o modo de teste no navegador. */
var FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
var nuvem = {
  user: null, fs: null, auth: null, m: null, timers: {},
  agendar: function(id){
    clearTimeout(nuvem.timers[id]);
    aviso('Salvando…');
    nuvem.timers[id] = setTimeout(function(){ nuvem.enviar(id); }, 700);
  },
  dados: function(c){
    return {owner: nuvem.user.uid, nome: c.nome || '', data: c.data || '', hora: c.hora || '', itens: c.itens, ultima: ultima(c) || null, atualizadoEm: new Date().toISOString()};
  },
  enviar: function(id, depois){
    var c = db.cultos.find(function(k){ return k.id === id; }); if (!c || !nuvem.user) return;
    clearTimeout(nuvem.timers[id]);
    nuvem.m.setDoc(nuvem.m.doc(nuvem.fs, 'cultos', id), nuvem.dados(c)).then(function(){ aviso('Salvo'); if (depois) depois(); }, function(e){ aviso('Sem conexão: salvo neste aparelho, envia quando voltar'); console.warn(e); });
  },
  versao: function(c, v){
    if (!nuvem.user) return;
    nuvem.m.setDoc(nuvem.m.doc(nuvem.fs, 'cultos', c.id, 'versoes', String(v.n)), {owner: nuvem.user.uid, n: v.n, em: v.em, retrato: v.retrato}).catch(function(e){ console.warn(e); });
  },
  apagar: function(id){
    if (!nuvem.user) return;
    nuvem.m.deleteDoc(nuvem.m.doc(nuvem.fs, 'cultos', id)).catch(function(e){ console.warn(e); });
  }
};
function aviso(t){ var n = document.getElementById('modeNote'); if (n && nuvem.user) n.textContent = nuvem.user.email + ' · ' + t; }

function telaLogin(mostrar){
  document.getElementById('login').style.display = mostrar ? 'flex' : 'none';
  document.querySelector('.cols').style.display = mostrar ? 'none' : '';
  document.getElementById('sair').style.display = mostrar ? 'none' : '';
}

function iniciarNuvem(cfg){
  telaLogin(true);
  document.getElementById('modeNote').textContent = 'Conectando…';
  Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')]).then(function(mods){
    var app = mods[0].initializeApp(cfg), A = mods[1], F = mods[2];
    nuvem.m = F; nuvem.auth = A.getAuth(app);
    try { nuvem.fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache()}); } catch (e) { nuvem.fs = F.getFirestore(app); }
    document.getElementById('modeNote').textContent = '';
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var erro = document.getElementById('lErro'); erro.textContent = '';
      A.signInWithEmailAndPassword(nuvem.auth, document.getElementById('lEmail').value.trim(), document.getElementById('lSenha').value).catch(function(err){
        var c = String(err && err.code || '');
        erro.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? 'E-mail ou senha errados.' :
          /network/.test(c) ? 'Sem internet agora.' : /too-many/.test(c) ? 'Muitas tentativas. Espere um pouco e tente de novo.' : 'Não deu para entrar (' + c + ').';
      });
    });
    document.getElementById('sair').addEventListener('click', function(){ A.signOut(nuvem.auth); });
    A.onAuthStateChanged(nuvem.auth, function(user){
      nuvem.user = user;
      if (!user) { aoVivo.fechar(); banco.parar(); db = {cultos: []}; ui.cultoId = null; ui.itemId = null; ui.view = 'cultos'; telaLogin(true); document.getElementById('modeNote').textContent = ''; render(); return; }
      telaLogin(false); aviso('Carregando…');
      banco.ouvir();
      F.getDocs(F.query(F.collection(nuvem.fs, 'cultos'), F.where('owner', '==', user.uid))).then(function(snap){
        var lista = [];
        snap.forEach(function(d){
          var x = d.data();
          lista.push({id: d.id, nome: x.nome || '', data: x.data || '', hora: x.hora || '', itens: x.itens || [], versoes: x.ultima ? [x.ultima] : []});
        });
        var teste = null;
        try { teste = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
        db = {cultos: lista};
        if (!ui.cultoId || !culto()) ui.cultoId = null;
        if (ui.cultoId && innerWidth > 900) ui.view = 'roteiro';
        aviso('Salvo'); render();
        /* Primeira vez na conta: oferece levar os cultos do modo de teste deste navegador. */
        if (!lista.length && teste && teste.cultos && teste.cultos.length) {
          dialogo('Levar os cultos de teste para a conta?', 'Este navegador tem ' + teste.cultos.length + (teste.cultos.length === 1 ? ' culto' : ' cultos') + ' do modo de teste.', 'Levar para a conta', function(){
            teste.cultos.forEach(function(c){ db.cultos.push(c); nuvem.enviar(c.id, function(){ var u = ultima(c); if (u) nuvem.versao(c, u); }); });
            render();
          });
        }
      }, function(e){ aviso('Não deu para carregar (' + (e && e.code || 'erro') + ')'); console.warn(e); });
    });
  }, function(e){
    document.getElementById('modeNote').textContent = 'Sem internet: não deu para abrir a conta';
    console.warn(e);
  });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function culto(){ return db.cultos.find(function(c){ return c.id === ui.cultoId; }) || null; }
function item(){ var c = culto(); return c ? (c.itens.find(function(i){ return i.id === ui.itemId; }) || null) : null; }

function proximoDomingo(){
  var d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseData(s){ var p = (s || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
function dataCurta(c){
  var d = parseData(c.data); if (!d) return 'sem data';
  return DIAS[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + (c.hora ? ' · ' + c.hora.replace(':00', 'h').replace(':', 'h') : '');
}
function quando(iso){
  var d = new Date(iso);
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + 'h' + String(d.getMinutes()).padStart(2, '0');
}

/* O que vai numa versão: o culto como está agora, sem as versões antigas. */
function retrato(c){ return {nome: c.nome, data: c.data, hora: c.hora, itens: JSON.parse(JSON.stringify(c.itens))}; }
function ultima(c){ return c.versoes.length ? c.versoes[c.versoes.length - 1] : null; }
function mudou(c){ var u = ultima(c); return !u || JSON.stringify(u.retrato) !== JSON.stringify(retrato(c)); }
function situacao(c){
  var u = ultima(c);
  if (!u) return {cor: '#6b6b78', texto: 'Rascunho · ainda não publicado', curto: 'rascunho'};
  if (mudou(c)) return {cor: 'var(--amber)', texto: 'Alterações não publicadas · última versão: v' + u.n + ', ' + quando(u.em), curto: 'v' + u.n + ' + alterações'};
  return {cor: 'var(--green)', texto: 'Publicado v' + u.n + ' · ' + quando(u.em), curto: 'v' + u.n + ' publicada'};
}

/* Link do Google Drive: tira o id do arquivo. Pasta não serve (a Projeção baixa um arquivo). */
function lerDrive(link){
  link = (link || '').trim();
  if (!link) return {estado: 'vazio'};
  if (!/^https?:\/\/(drive|docs)\.google\.com\//i.test(link)) return {estado: 'naoDrive'};
  if (/\/folders\//.test(link)) return {estado: 'pasta'};
  var m = link.match(/\/d\/([A-Za-z0-9_-]{15,})/) || link.match(/[?&]id=([A-Za-z0-9_-]{15,})/);
  return m ? {estado: 'ok', id: m[1]} : {estado: 'naoDrive'};
}
function slides(texto){ return (texto || '').split(/\n\s*\n/).filter(function(s){ return s.trim(); }).length; }
function resumo(i){
  var t = TIPOS[i.tipo].nome;
  if (i.tipo === 'musica' && i.musicaId) return t + ' · do banco da igreja' + (i.artista ? ' · ' + esc(i.artista) : '');
  if (i.tipo === 'musica' || i.tipo === 'texto') { var n = slides(i.letra); return t + ' · ' + (n ? n + (n === 1 ? ' slide' : ' slides') : (i.tipo === 'musica' ? 'da biblioteca da Projeção' : 'sem texto ainda')); }
  var d = lerDrive(i.link);
  if (d.estado === 'ok') return t + ' · arquivo do Drive';
  return t + ' · <span class="warnTxt">falta o link do arquivo</span>';
}

/* ---------------- telas ---------------- */

function render(){
  document.getElementById('app').dataset.view = ui.view;
  renderCultos(); renderRoteiro(); renderEditor();
}

function renderCultos(){
  var el = document.getElementById('cultos');

  lista.forEach(function(c){

/* Só a parte de cima e a linha do item mudam enquanto a pessoa digita (o campo não perde o foco). */
function atualizarStatus(){

function atualizarLinha(i){

function renderEditor(){

  } else if (i.tipo === 'imagem' || i.tipo === 'video') {

  }

function mostrarSlides(i){

}
function mostrarLink(i){
  var m = document.getElementById('linkMsg'); if (!m) return;
  var d = lerDrive(i.link);
  var t = {
    vazio: ['warn', 'Falta o link do arquivo.'],
    ok: ['ok', 'Arquivo do Drive reconhecido.'],
    pasta: ['bad', 'Isso é o link de uma pasta. Abra o arquivo e copie o link dele.'],
    naoDrive: ['bad', 'Não parece um link de arquivo do Google Drive.']
  }[d.estado];
  m.className = 'msg ' + t[0]; m.textContent = t[1];
}

/* ---------------- ações ---------------- */

function novoCulto(base){
  var c = base ? JSON.parse(JSON.stringify(retrato(base))) : {nome: 'Culto de domingo', data: proximoDomingo(), hora: '19:00', itens: []};
  c.id = uid(); c.versoes = [];
  if (base) { c.nome = base.nome + ' (cópia)'; c.data = proximoDomingo(); c.itens.forEach(function(i){ i.id = uid(); }); }
  db.cultos.push(c); ui.cultoId = c.id; ui.itemId = null; ui.view = 'roteiro';
  salvar(); render();
  var n = document.getElementById('cNome'); if (n) { n.focus(); n.select(); }
}
function novoItem(tipo){
  var c = culto(); if (!c) return;
  var i = {id: uid(), tipo: tipo, titulo: '', destino: TIPOS[tipo].destinos[0], letra: '', link: '', obs: ''};
  c.itens.push(i); ui.itemId = i.id; ui.view = 'item';
  salvar(); render();
  var t = document.getElementById('iTitulo'); if (t) t.focus();
}
function publicar(){
  var c = culto(); if (!c || !mudou(c)) return;
  var faltando = c.itens.filter(function(i){ return (i.tipo === 'imagem' || i.tipo === 'video') && lerDrive(i.link).estado !== 'ok'; });
  var fazer = function(){
    banco.guardarNovas(c);
    var n = (ultima(c) ? ultima(c).n : 0) + 1;
    c.versoes.push({n: n, em: new Date().toISOString(), retrato: retrato(c)});
    salvar();
    /* O histórico da versão só depois do culto estar salvo na conta (as regras conferem o dono nele). */
    if (nuvem.user) nuvem.enviar(c.id, function(){ nuvem.versao(c, ultima(c)); });
    render();
    toast('v' + n + ' publicada. Quando o app estiver ligado ao Firebase, é aqui que a Projeção recebe a versão nova.');
  };
  if (faltando.length) {
    dialogo('Publicar mesmo assim?', faltando.length + (faltando.length === 1 ? ' item está' : ' itens estão') + ' sem um link válido do Google Drive (' +
      faltando.map(function(i){ return esc(i.titulo || TIPOS[i.tipo].nome); }).join(', ') + '). A Projeção vai avisar que falta arquivo.', 'Publicar', fazer);
  } else fazer();
}
/* Enquanto não há servidor: a última versão publicada vira um texto para colar na Projeção
 * ("Cultos do Diretor" › "Colar culto do Diretor"). É o mesmo conteúdo que vai para o Firebase. */
function textoParaProjecao(c){
  var u = ultima(c); if (!u) return '';
  var r = u.retrato;
  return 'PLCULTO1 ' + JSON.stringify({formato: 'projeto-live-culto', cultoId: c.id, nome: r.nome, data: r.data, hora: r.hora, versao: u.n, publicadaEm: u.em, itens: r.itens});
}
function copiarParaProjecao(){
  var c = culto(); if (!c || !ultima(c)) return;
  var texto = textoParaProjecao(c), n = ultima(c).n;
  var aviso = mudou(c) ? ' Atenção: as alterações depois da v' + n + ' não vão junto; publique antes.' : '';
  var manual = function(){
    var bg = document.createElement('div'); bg.className = 'dialogBg';
    bg.innerHTML = '<div class="dialog" role="dialog" aria-modal="true"><div style="font-weight:700;font-size:16px">Copie o texto abaixo</div>' +
      '<div class="muted small">Selecione tudo, copie e cole na Projeção em "Cultos do Diretor".</div>' +
      '<textarea readonly style="width:100%;min-height:140px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;color:var(--text)"></textarea>' +
      '<div class="row"><button class="btn primary" data-x>Pronto</button></div></div>';
    document.body.appendChild(bg);
    var ta = bg.querySelector('textarea'); ta.value = texto; ta.focus(); ta.select();
    bg.querySelector('[data-x]').onclick = function(){ bg.remove(); };
  };
  try {
    navigator.clipboard.writeText(texto).then(function(){
      toast('v' + n + ' copiada. Na Projeção: Projetos › + › Cultos do Diretor › Colar culto do Diretor.' + aviso);
    }, manual);
  } catch (e) { manual(); }
}

function moverItem(id, para){
  var c = culto(); var de = c.itens.findIndex(function(i){ return i.id === id; });
  if (de < 0) return;
  var it = c.itens.splice(de, 1)[0];
  if (para > de) para--;
  c.itens.splice(para, 0, it);
  salvar(); renderRoteiro(); renderEditor(); atualizarStatus();
}

/* ---------------- menus, avisos ---------------- */

var menuEl = null;
function fecharMenu(){ if (menuEl) { menuEl.remove(); menuEl = null; } }
function menu(x, y, opcoes){
  fecharMenu();
  menuEl = document.createElement('div'); menuEl.className = 'menu'; menuEl.setAttribute('role', 'menu');
  opcoes.forEach(function(o){
    if (o === '-') { menuEl.appendChild(document.createElement('hr')); return; }
    var b = document.createElement('button'); b.textContent = o.t; b.setAttribute('role', 'menuitem');
    if (o.perigo) b.className = 'danger';
    b.addEventListener('click', function(){ fecharMenu(); o.f(); });
    menuEl.appendChild(b);
  });
  document.body.appendChild(menuEl);
  var r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  menuEl.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  menuEl.querySelector('button').focus();
}
function toast(texto){
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = texto;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 4500);
}
function dialogo(titulo, html, ok, f){
  var bg = document.createElement('div'); bg.className = 'dialogBg';
  bg.innerHTML = '<div class="dialog" role="dialog" aria-modal="true"><div style="font-weight:700;font-size:16px">' + esc(titulo) + '</div><div class="muted" style="line-height:1.5">' + html + '</div>' +
    '<div class="row"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>' + esc(ok) + '</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelector('[data-x]').onclick = function(){ bg.remove(); };
  bg.querySelector('[data-ok]').onclick = function(){ bg.remove(); f(); };
  bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
  bg.querySelector('[data-ok]').focus();
}

function menuItem(id, x, y){
  var c = culto(); var i = c.itens.find(function(k){ return k.id === id; }); if (!i) return;
  menu(x, y, [
    {t: 'Duplicar', f: function(){ var n = JSON.parse(JSON.stringify(i)); n.id = uid(); c.itens.splice(c.itens.indexOf(i) + 1, 0, n); ui.itemId = n.id; salvar(); render(); }},
    '-',
    {t: 'Tirar do roteiro', perigo: true, f: function(){ c.itens.splice(c.itens.indexOf(i), 1); if (ui.itemId === id) { ui.itemId = null; if (ui.view === 'item') ui.view = 'roteiro'; } salvar(); render(); }}
  ]);
}
function menuCulto(id, x, y){
  var c = db.cultos.find(function(k){ return k.id === id; }); if (!c) return;
  menu(x, y, [
    {t: 'Duplicar para o próximo domingo', f: function(){ novoCulto(c); }},
    '-',
    {t: 'Apagar culto', perigo: true, f: function(){
      dialogo('Apagar este culto?', esc(c.nome) + ' · ' + esc(dataCurta(c)) + '. As versões publicadas somem junto.', 'Apagar', function(){
        db.cultos.splice(db.cultos.indexOf(c), 1);
        nuvem.apagar(id);
        if (ui.cultoId === id) { ui.cultoId = null; ui.itemId = null; ui.view = 'cultos'; }
        salvar(); render();
      });
    }}
  ]);
}


/* ---------------- banco de músicas da igreja (musicas/<id>) ----------------
 * A Projeção sobe a biblioteca dela para a conta; aqui o diretor busca pelo nome ou por um trecho
 * da letra e vê a prévia. Música nova (com a letra colada) entra no banco ao publicar e desce sozinha
 * para a Projeção. A capa e o artista de uma música nova podem vir do catálogo da Apple (iTunes). */
function semAcento(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
var banco = {
  lista: [], parar_: null, apple: [], appleTermo: '', appleTimer: null,
  ouvir: function(){
    banco.parar();
    var F = nuvem.m;
    banco.parar_ = F.onSnapshot(F.query(F.collection(nuvem.fs, 'musicas'), F.where('owner', '==', nuvem.user.uid)), function(snap){
      var lista = [];
      snap.forEach(function(d){
        var x = d.data(); if (x.apagada) return;
        lista.push({id: d.id, titulo: x.titulo || '', artista: x.artista || '', capa: x.capa || '', letra: x.letra || '', showId: x.showId || '',
          nt: semAcento(x.titulo), na: semAcento(x.artista), nl: semAcento(x.letra)});
      });
      lista.sort(function(a, b){ return a.titulo.localeCompare(b.titulo, 'pt'); });
      banco.lista = lista;
      var i = item(); if (i && i.tipo === 'musica' && document.getElementById('bRes')) banco.buscar(i);
    }, function(e){ console.warn('banco de músicas', e); banco.semPermissao = /permission/i.test(String(e && e.code || e)); var i = item(); if (i && i.tipo === 'musica') banco.buscar(i); });
  },
  parar: function(){ if (banco.parar_) { try { banco.parar_(); } catch (e) {} } banco.parar_ = null; banco.lista = []; },
  achar: function(id){ return banco.lista.find(function(m){ return m.id === id; }) || null; },
  editor: function(i){
    var m = i.musicaId ? banco.achar(i.musicaId) : null;
    if (i.musicaId) {
      var capa = (m && m.capa) || i.capa;
      return '<div class="field"><label>Música do banco da igreja</label><div class="escolhida">' +
        (capa ? '<img class="capa" src="' + esc(capa) + '" alt="">' : '<div class="capa">♪</div>') +
        '<div style="min-width:0;flex:1"><div style="font-weight:700">' + esc((m && m.titulo) || i.titulo) + '</div>' +
        '<div class="muted small">' + esc((m && m.artista) || i.artista || '') + '</div>' +
        '<div class="previa">' + (m ? esc(m.letra) : 'A letra aparece aqui quando o banco carregar.') + '</div></div>' +
        '<button class="btn link small" data-trocarmusica>Trocar</button></div></div>';
    }
    return '<div class="field busca"><label for="iBusca">Buscar no banco da igreja · pelo nome ou por um trecho da letra</label>' +
      '<input id="iBusca" autocomplete="off" placeholder="Ex.: grande é o senhor  ou  teu nome é santo" value="' + esc(ui.busca || '') + '">' +
      '<div class="bRes" id="bRes"></div></div>';
  },
  buscar: function(i){
    var campo = document.getElementById('iBusca'), res = document.getElementById('bRes');
    if (!campo || !res) return;
    ui.busca = campo.value;
    var q = semAcento(campo.value);
    if (!q) {
      res.innerHTML = banco.lista.length ? '' : banco.semPermissao ? '<div class="msg bad" style="padding:6px 2px">O banco de músicas está sem permissão: cole as regras novas (firestore.rules) no console do Firebase.</div>' :
        '<div class="muted small" style="padding:6px 2px">O banco ainda está vazio: abra a Projeção (versão nova) conectada à conta e ela envia a biblioteca de músicas.</div>';
      return;
    }
    var termos = q.split(' ');
    var achados = [];
    banco.lista.forEach(function(m){
      var tudo = m.nt + ' ' + m.na + ' ' + m.nl, nota = 0;
      if (m.nt.indexOf(q) === 0) nota = 4; else if (m.nt.indexOf(q) >= 0) nota = 3;
      else if (m.nl.indexOf(q) >= 0) nota = 2;
      else if (termos.every(function(t){ return tudo.indexOf(t) >= 0; })) nota = 1;
      if (nota) achados.push({m: m, nota: nota});
    });
    achados.sort(function(a, b){ return b.nota - a.nota || a.m.titulo.localeCompare(b.m.titulo, 'pt'); });
    var h = '<div class="sec">No banco da igreja</div>';
    h += achados.length ? achados.slice(0, 8).map(function(x){
      var m = x.m;
      return '<button class="r" data-musica="' + esc(m.id) + '">' + (m.capa ? '<img class="capa" src="' + esc(m.capa) + '" alt="">' : '<div class="capa">♪</div>') +
        '<div style="min-width:0;flex:1"><div class="t">' + esc(m.titulo) + '</div>' + (m.artista ? '<div class="a">' + esc(m.artista) + '</div>' : '') +
        '<div class="l">' + banco.trecho(m, q, termos) + '</div></div></button>';
    }).join('') : '<div class="muted small" style="padding:4px 2px">Nenhuma música do banco tem esse nome ou trecho.</div>';
    h += '<div class="sec">Música nova · catálogo (a letra vem do LRCLIB)</div><div id="bApple"><div class="muted small" style="padding:4px 2px">Procurando…</div></div>';
    res.innerHTML = h;
    banco.catalogo(campo.value.trim());
  },
  /* A linha da letra onde está o trecho (com o trecho marcado); sem trecho, o começo da letra. */
  trecho: function(m, q, termos){
    var linhas = m.letra.split('\n'), alvo = '';
    for (var k = 0; k < linhas.length; k++) { if (semAcento(linhas[k]).indexOf(q) >= 0) { alvo = linhas[k]; break; } }
    if (!alvo) for (var j = 0; j < linhas.length; j++) { if (semAcento(linhas[j]).indexOf(termos[0]) >= 0) { alvo = linhas[j]; break; } }
    if (!alvo) alvo = linhas.filter(function(l){ return l.trim(); }).slice(0, 2).join(' / ');
    var limpo = esc(alvo);
    var base0 = semAcento(alvo), em = base0.indexOf(q);
    if (em >= 0 && base0.length === alvo.length) return esc(alvo.slice(0, em)) + '<mark>' + esc(alvo.slice(em, em + q.length)) + '</mark>' + esc(alvo.slice(em + q.length));
    termos.forEach(function(t){
      if (t.length < 3) return;
      /* marca a palavra mesmo com acento: compara letra a letra sem acento */
      var base = semAcento(alvo), at = base.indexOf(t);
      if (at >= 0 && base.length === alvo.length) limpo = esc(alvo.slice(0, at)) + '<mark>' + esc(alvo.slice(at, at + t.length)) + '</mark>' + esc(alvo.slice(at + t.length));
    });
    return limpo;
  },
  catalogo: function(termo){
    clearTimeout(banco.appleTimer);
    if (termo.length < 3) { var b = document.getElementById('bApple'); if (b) b.innerHTML = ''; return; }
    banco.appleTimer = setTimeout(function(){
      var nome = 'plApple' + Date.now();
      var s = document.createElement('script');
      window[nome] = function(r){
        delete window[nome]; s.remove();
        banco.apple = (r && r.results || []).map(function(x){ return {titulo: x.trackName || '', artista: x.artistName || '', album: x.collectionName || '', duracao: Math.round((x.trackTimeMillis || 0) / 1000), capa: String(x.artworkUrl100 || '').replace('100x100', '300x300')}; });
        banco.mostrarApple();
      };
      s.onerror = function(){ delete window[nome]; s.remove(); var b = document.getElementById('bApple'); if (b) b.innerHTML = '<div class="muted small" style="padding:4px 2px">Catálogo indisponível agora.</div>'; };
      s.src = 'https://itunes.apple.com/search?media=music&entity=song&country=BR&limit=6&term=' + encodeURIComponent(termo) + '&callback=' + nome;
      document.body.appendChild(s);
    }, 450);
  },
  mostrarApple: function(){
    var b = document.getElementById('bApple'); if (!b) return;
    b.innerHTML = banco.apple.length ? banco.apple.map(function(x, k){
      return '<button class="r" data-apple="' + k + '">' + (x.capa ? '<img class="capa" src="' + esc(x.capa) + '" alt="" loading="lazy">' : '<div class="capa">♪</div>') +
        '<div style="min-width:0;flex:1"><div class="t">' + esc(x.titulo) + '</div><div class="a">' + esc(x.artista) + '</div></div></button>';
    }).join('') : '<div class="muted small" style="padding:4px 2px">Nada no catálogo.</div>';
  },
  semPermissao: false,
  escolher: function(id){
    var i = item(), m = banco.achar(id); if (!i || !m) return;
    i.musicaId = m.id; i.showId = m.showId || ''; i.titulo = m.titulo; i.artista = m.artista; i.capa = m.capa; i.letra = '';
    ui.busca = ''; salvar(); atualizarLinha(i); atualizarStatus(); renderEditor();
  },
  escolherApple: function(k){
    var i = item(), x = banco.apple[k]; if (!i || !x) return;
    i.musicaId = ''; i.showId = ''; i.titulo = x.titulo; i.artista = x.artista; i.capa = x.capa;
    ui.busca = ''; ui.letraNota = 'Buscando a letra…'; salvar(); atualizarLinha(i); atualizarStatus(); renderEditor();
    banco.letra(x).then(function(letra){
      var atual = item(); if (!atual || atual.id !== i.id) return;
      if (letra) {
        i.letra = letra; ui.letraNota = 'Letra encontrada no LRCLIB (base aberta de letras). Confira e corrija antes de publicar: ao publicar, ela entra no banco da igreja e vai sozinha para a Projeção.';
        salvar(); atualizarLinha(i); atualizarStatus();
      } else ui.letraNota = 'Não achei a letra desta gravação. Cole a letra aqui.';
      renderEditor();
    });
  },
  /* A letra no LRCLIB: primeiro a gravação exata (nome, artista, álbum e duração), depois uma busca. */
  letra: function(x){
    var base = 'https://lrclib.net/api/', head = {headers: {'Lrclib-Client': 'Projeto Live Diretor (https://github.com/denysondetrano30/projeto-live-diretor)'}};
    var limpa = function(t){ return String(t || '').replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim(); };
    var pega = function(url){ return fetch(url, head).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); };
    var exata = base + 'get?track_name=' + encodeURIComponent(x.titulo) + '&artist_name=' + encodeURIComponent(x.artista) +
      (x.album ? '&album_name=' + encodeURIComponent(x.album) : '') + (x.duracao ? '&duration=' + x.duracao : '');
    return pega(exata).then(function(d){
      if (d && d.plainLyrics) return limpa(d.plainLyrics);
      return pega(base + 'search?track_name=' + encodeURIComponent(x.titulo) + '&artist_name=' + encodeURIComponent(x.artista)).then(function(lista){
        var achou = (lista || []).find(function(a){ return a.plainLyrics; });
        if (achou) return limpa(achou.plainLyrics);
        return pega(base + 'search?q=' + encodeURIComponent(x.titulo)).then(function(l2){
          var a2 = (l2 || []).find(function(a){ return a.plainLyrics; });
          return a2 ? limpa(a2.plainLyrics) : '';
        });
      });
    });
  },
  trocar: function(){
    var i = item(); if (!i) return;
    i.musicaId = ''; i.showId = ''; salvar(); atualizarLinha(i); atualizarStatus(); renderEditor();
  },
  /* Ao publicar: cada música com letra colada que ainda não está no banco vira uma música do banco. */
  guardarNovas: function(c){
    if (!nuvem.user) return;
    c.itens.forEach(function(i){
      if (i.tipo !== 'musica' || i.musicaId || !(i.letra || '').trim()) return;
      var id = nuvem.user.uid + '_d_' + uid();
      i.musicaId = id;
      nuvem.m.setDoc(nuvem.m.doc(nuvem.fs, 'musicas', id), {owner: nuvem.user.uid, titulo: i.titulo || 'Música', artista: i.artista || '', capa: i.capa || '',
        letra: i.letra, origem: 'diretor', pendente: true, apagada: false, atualizadoEm: new Date().toISOString()}).catch(function(e){ console.warn('banco de músicas', e); });
    });
  }
};

/* ---------------- ao vivo (bloco 6) ----------------
 * Durante o culto, pela conta:
 * - "Agora no telão": a Projeção escreve em aoVivo/<culto>.agora o item que está no telão;
 * - recados: o diretor manda para Todos, Projeção ou Transmissão (respostas prontas ou texto);
 *   a resposta da Projeção aparece na conversa;
 * - sugestões de mídia: link do Drive + onde entra; a Projeção baixa e o operador insere ou descarta.
 * Tudo fica em aoVivo/<culto>/eventos. */
var RESPOSTAS = ['Próximo item', 'Espera', 'Plano geral', 'Volta pra letra'];
var PARA = {todos: 'Todos', projecao: 'Projeção', transmissao: 'Transmissão'};
var ESTADO = {enviada: 'Enviada, esperando a Projeção', baixando: 'A Projeção está baixando', na_fila: 'Pronta na Projeção, o operador decide', inserida: 'Inserida no culto', descartada: 'O operador descartou', erro: 'Não deu'};
var aoVivo = {
  id: null, agora: null, eventos: [], para: 'todos', respostas: RESPOSTAS.slice(), parar: [], relogio: null,
  abrir: function(){
    var c = culto(); if (!c || !nuvem.user) return;
    var F = nuvem.m, fs = nuvem.fs, uidU = nuvem.user.uid;
    aoVivo.fechar();
    aoVivo.id = c.id; aoVivo.agora = null; aoVivo.eventos = [];
    var el = document.getElementById('aovivo');
    el.style.display = 'flex';
    el.innerHTML = '<div class="bar"><button class="btn link" data-lvfechar>‹ Roteiro</button><span class="pulse"></span><span class="t">Ao vivo · ' + esc(c.nome || 'Culto') + '</span><span class="muted small" id="lvNet"></span></div>' +
      '<div class="wrap">' +
      '<div class="card agora full" id="lvAgora"></div>' +
      '<div class="card"><div class="lbl">Recados</div>' +
        '<div class="chips" id="lvPara"></div>' +
        '<div class="chips" id="lvResp"></div>' +
        '<form class="send" id="lvForm"><input id="lvTexto" placeholder="Escreva um recado" autocomplete="off"><button class="btn primary">Enviar</button></form>' +
        '<div class="muted small" id="lvParaNota"></div>' +
        '<div class="thread" id="lvThread"></div></div>' +
      '<div class="card"><div class="lbl">Sugerir mídia</div>' +
        '<div class="field"><input id="lvSTitulo" placeholder="Nome (ex.: Vídeo da campanha)"></div>' +
        '<div class="field"><input id="lvSLink" inputmode="url" placeholder="Link do Google Drive"><div class="msg" id="lvSMsg"></div></div>' +
        '<div class="field"><select id="lvSPos"></select></div>' +
        '<button class="btn primary" id="lvSEnviar">Enviar para a Projeção</button>' +
        '<div id="lvSug"></div></div>' +
      '</div>';
    aoVivo.chips(); aoVivo.posicoes(); aoVivo.desenhar();
    document.getElementById('lvForm').addEventListener('submit', function(e){ e.preventDefault(); var i = document.getElementById('lvTexto'); aoVivo.recado(i.value); i.value = ''; });
    document.getElementById('lvSLink').addEventListener('input', function(e){
      var r = lerDrive(e.target.value.trim()), m = document.getElementById('lvSMsg');
      m.className = 'msg ' + (r.estado === 'ok' ? 'ok' : e.target.value.trim() ? 'bad' : '');
      m.textContent = {ok: 'Link do Drive certo. Lembre: compartilhado como "Qualquer pessoa com o link".', pasta: 'Isso é uma pasta; abra o arquivo e copie o link dele.', naoDrive: 'Não parece um link de arquivo do Google Drive.', vazio: ''}[r.estado] || '';
    });
    document.getElementById('lvSEnviar').addEventListener('click', aoVivo.sugerir);
    el.addEventListener('click', aoVivo.clique);
    aoVivo.relogio = setInterval(aoVivo.desenharAgora, 5000);

    var ref = F.doc(fs, 'aoVivo', c.id);
    document.getElementById('lvNet').textContent = 'Conectando…';
    F.setDoc(ref, {owner: uidU}, {merge: true}).then(function(){
      if (aoVivo.id !== c.id) return;
      aoVivo.parar.push(F.onSnapshot(ref, {includeMetadataChanges: true}, function(d){
        var x = d.data() || {};
        aoVivo.agora = x.agora || null;
        document.getElementById('lvNet').textContent = d.metadata.fromCache ? 'Sem internet' : '';
        aoVivo.desenharAgora(); aoVivo.posicoes();
      }, function(e){ console.warn(e); document.getElementById('lvNet').textContent = 'Sem permissão (veja as regras)'; }));
      var desde = new Date(Date.now() - 12 * 60 * 60 * 1000).toISOString();
      var q = F.query(F.collection(fs, 'aoVivo', c.id, 'eventos'), F.where('em', '>', desde), F.orderBy('em'));
      aoVivo.parar.push(F.onSnapshot(q, function(snap){
        var lista = []; snap.forEach(function(d){ var x = d.data(); x.id = d.id; lista.push(x); });
        aoVivo.eventos = lista; aoVivo.desenhar();
      }, function(e){ console.warn(e); }));
    }, function(e){ console.warn(e); document.getElementById('lvNet').textContent = 'Sem permissão (veja as regras)'; });
    F.getDoc(F.doc(fs, 'perfis', uidU)).then(function(d){
      var r = d.exists() && d.data().respostas;
      if (Array.isArray(r) && r.length) { aoVivo.respostas = r; aoVivo.chips(); }
    }, function(){});
  },
  fechar: function(){
    aoVivo.parar.forEach(function(f){ try { f(); } catch (e) {} });
    aoVivo.parar = []; clearInterval(aoVivo.relogio); aoVivo.id = null;
    var el = document.getElementById('aovivo');
    var novo = el.cloneNode(false); novo.style.display = 'none'; /* troca o elemento: some com os ouvintes de clique */
    el.parentNode.replaceChild(novo, el);
  },
  clique: function(e){
    var t = e.target;
    if (t.closest('[data-lvfechar]')) return aoVivo.fechar();
    var p = t.closest('[data-para]'); if (p) { aoVivo.para = p.dataset.para; return aoVivo.chips(); }
    var r = t.closest('[data-resp]'); if (r) return aoVivo.recado(aoVivo.respostas[+r.dataset.resp]);
    if (t.closest('[data-lvedit]')) return aoVivo.editar();
  },
  chips: function(){
    var a = document.getElementById('lvPara'); if (!a) return;
    a.innerHTML = Object.keys(PARA).map(function(k){ return '<button type="button" data-para="' + k + '" class="' + (aoVivo.para === k ? 'on' : '') + '">' + PARA[k] + '</button>'; }).join('');
    document.getElementById('lvResp').innerHTML = aoVivo.respostas.map(function(r, i){ return '<button type="button" class="resp" data-resp="' + i + '">' + esc(r) + '</button>'; }).join('') +
      '<button type="button" class="btn link small" data-lvedit>Editar</button>';
    document.getElementById('lvParaNota').textContent = aoVivo.para === 'transmissao' ? 'Aparece no canto do Projeto Live (OBS), se ele estiver entrado na conta.' : '';
  },
  editar: function(){
    dialogo('Respostas prontas', 'Uma por linha:<textarea id="lvREd" style="width:100%;min-height:150px;margin-top:8px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;color:var(--text)"></textarea>', 'Salvar', function(){});
    var ta = document.getElementById('lvREd'); ta.value = aoVivo.respostas.join('\n');
    var ok = ta.closest('.dialog').querySelector('[data-ok]');
    ok.onclick = function(){
      var lista = ta.value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 12);
      aoVivo.respostas = lista.length ? lista : RESPOSTAS.slice();
      ta.closest('.dialogBg').remove(); aoVivo.chips();
      nuvem.m.setDoc(nuvem.m.doc(nuvem.fs, 'perfis', nuvem.user.uid), {respostas: aoVivo.respostas}, {merge: true}).catch(function(e){ console.warn(e); });
    };
  },
  enviar: function(evento){
    if (!aoVivo.id || !nuvem.user) return;
    evento.owner = nuvem.user.uid; evento.de = 'diretor'; evento.em = new Date().toISOString();
    nuvem.m.addDoc(nuvem.m.collection(nuvem.fs, 'aoVivo', aoVivo.id, 'eventos'), evento).catch(function(e){ console.warn(e); toast('Não deu para enviar (' + (e && e.code || 'erro') + ')'); });
  },
  recado: function(texto){
    texto = String(texto || '').trim(); if (!texto) return;
    aoVivo.enviar({tipo: 'recado', para: aoVivo.para, texto: texto});
  },
  sugerir: function(){
    var link = document.getElementById('lvSLink').value.trim();
    if (lerDrive(link).estado !== 'ok') { toast('Cole um link válido do Google Drive.'); return; }
    var titulo = document.getElementById('lvSTitulo').value.trim() || 'Mídia do diretor';
    var v = document.getElementById('lvSPos').value, posicao = {tipo: 'quandoDer'};
    if (v === 'atual') posicao = {tipo: 'depoisAtual', itemId: aoVivo.agora && aoVivo.agora.itemId || null, titulo: aoVivo.agora && aoVivo.agora.titulo || ''};
    else if (v.indexOf('i:') === 0) { var it = (culto() || {itens: []}).itens.find(function(i){ return i.id === v.slice(2); }); posicao = {tipo: 'depoisItem', itemId: v.slice(2), titulo: it ? (it.titulo || TIPOS[it.tipo].nome) : ''}; }
    aoVivo.enviar({tipo: 'sugestao', para: 'projecao', titulo: titulo, link: link, posicao: posicao, estado: 'enviada'});
    document.getElementById('lvSTitulo').value = ''; document.getElementById('lvSLink').value = ''; document.getElementById('lvSMsg').textContent = '';
    toast('Sugestão enviada. A Projeção baixa e o operador decide.');
  },
  posicoes: function(){
    var s = document.getElementById('lvSPos'); if (!s) return;
    var atual = s.value, c = culto();
    var h = '<option value="atual">Logo depois do que está no telão</option><option value="livre">Quando der (o operador escolhe)</option>';
    (c ? c.itens : []).forEach(function(i, n){ h += '<option value="i:' + i.id + '">Depois de ' + (n + 1) + '. ' + esc(i.titulo || TIPOS[i.tipo].nome) + '</option>'; });
    s.innerHTML = h; if (atual) s.value = atual;
  },
  desenharAgora: function(){
    var el = document.getElementById('lvAgora'); if (!el) return;
    var a = aoVivo.agora, c = culto();
    if (!a) { el.innerHTML = '<div class="lbl">Agora no telão</div><div class="muted">Esperando a Projeção abrir este culto (Cultos do Diretor › Abrir projeto) e escolher um item.</div>'; return; }
    var prox = c && a.indice ? c.itens[a.indice] : null;
    var seg = a.em ? Math.max(0, Math.round((Date.now() - Date.parse(a.em)) / 1000)) : null;
    el.innerHTML = '<div class="lbl">Agora no telão' + (seg !== null ? ' · há ' + (seg < 60 ? seg + ' s' : Math.round(seg / 60) + ' min') : '') + '</div>' +
      '<div class="big">' + (a.indice ? a.indice + '. ' : '') + esc(a.titulo || 'Item extra') + '</div>' +
      (prox ? '<div class="next">Depois: ' + esc(prox.titulo || TIPOS[prox.tipo].nome) + '</div>' : (a.indice ? '' : '<div class="next">Item que não está no roteiro</div>'));
  },
  desenhar: function(){
    aoVivo.desenharAgora();
    var th = document.getElementById('lvThread'); if (!th) return;
    var rec = aoVivo.eventos.filter(function(e){ return e.tipo === 'recado'; }).slice(-40);
    th.innerHTML = rec.length ? rec.map(function(e){
      var eu = e.de === 'diretor';
      var quem = eu ? 'Você → ' + (PARA[e.para] || e.para) : (e.de === 'projecao' ? 'Projeção' : e.de === 'transmissao' ? 'Transmissão' : e.de);
      return '<div class="m' + (eu ? ' eu' : '') + '"><div class="w">' + esc(quem) + ' · ' + esc(hora(e.em)) + '</div>' + esc(e.texto) + '</div>';
    }).join('') : '<div class="muted small">Nenhum recado ainda.</div>';
    th.scrollTop = th.scrollHeight;
    var sg = aoVivo.eventos.filter(function(e){ return e.tipo === 'sugestao'; }).reverse();
    document.getElementById('lvSug').innerHTML = sg.map(function(e){
      var cor = e.estado === 'inserida' ? 'ok' : e.estado === 'erro' || e.estado === 'descartada' ? 'bad' : 'warn';
      return '<div class="sug"><span>' + esc(e.titulo) + '</span><span class="' + cor + '">' + esc(ESTADO[e.estado] || e.estado) + (e.estado === 'erro' && e.motivo ? ': ' + esc(e.motivo) : '') + '</span></div>';
    }).join('');
  }
};
function hora(iso){ var d = new Date(iso); return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

/* ---------------- eventos ---------------- */

document.addEventListener('click', function(e){
  if (menuEl && !menuEl.contains(e.target)) fecharMenu();
  var t = e.target;
  if (t.closest('#novoCulto')) return novoCulto();
  var cb = t.closest('[data-culto]');
  if (cb) { ui.cultoId = cb.dataset.culto; ui.itemId = null; ui.view = 'roteiro'; salvar(); return render(); }
  if (t.closest('[data-publicar]')) return publicar();
  if (t.closest('[data-copiar]')) return copiarParaProjecao();
  if (t.closest('[data-aovivo]')) return aoVivo.abrir();
  var bm = t.closest('[data-musica]'); if (bm) return banco.escolher(bm.dataset.musica);
  var ba = t.closest('[data-apple]'); if (ba) return banco.escolherApple(+ba.dataset.apple);
  if (t.closest('[data-trocarmusica]')) return banco.trocar();
  var v = t.closest('[data-voltar]');
  if (v) { ui.view = v.dataset.voltar; if (ui.view === 'cultos') ui.itemId = null; return render(); }
  if (t.closest('#addItem')) {
    var r = t.closest('#addItem').getBoundingClientRect();
    return menu(r.left, r.bottom + 6, Object.keys(TIPOS).map(function(k){ return {t: TIPOS[k].nome, f: function(){ novoItem(k); }}; }));
  }
  var li = t.closest('[data-item]');
  if (li && !t.closest('[data-grip]')) { ui.letraNota = ''; ui.itemId = li.dataset.item; ui.view = 'item'; renderRoteiro(); renderEditor(); document.getElementById('app').dataset.view = ui.view; }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fecharMenu(); });

document.addEventListener('contextmenu', function(e){
  var li = e.target.closest('[data-item]'), cb = e.target.closest('[data-culto]');
  if (li) { e.preventDefault(); menuItem(li.dataset.item, e.clientX, e.clientY); }
  else if (cb) { e.preventDefault(); menuCulto(cb.dataset.culto, e.clientX, e.clientY); }
});

/* Toque longo (celular) abre o mesmo menu do botão direito. */
var longo = null;
document.addEventListener('touchstart', function(e){
  var li = e.target.closest('[data-item]'), cb = e.target.closest('[data-culto]');
  if ((!li && !cb) || e.target.closest('[data-grip]')) return;
  var p = e.touches[0];
  longo = setTimeout(function(){
    longo = null;
    if (li) menuItem(li.dataset.item, p.clientX, p.clientY); else menuCulto(cb.dataset.culto, p.clientX, p.clientY);
  }, 550);
}, {passive: true});
['touchend', 'touchmove', 'touchcancel'].forEach(function(n){ document.addEventListener(n, function(){ if (longo) { clearTimeout(longo); longo = null; } }, {passive: true}); });

document.addEventListener('input', function(e){
  var c = culto(); if (!c) return;
  var id = e.target.id, i = item();
  if (id === 'cNome') c.nome = e.target.value;
  else if (id === 'cData') c.data = e.target.value;
  else if (id === 'cHora') c.hora = e.target.value;
  else if (i && id === 'iBusca') { banco.buscar(i); return; }
  else if (i && id === 'iTitulo') i.titulo = e.target.value;
  else if (i && id === 'iLetra') { i.letra = e.target.value; mostrarSlides(i); }
  else if (i && id === 'iLink') { i.link = e.target.value.trim(); mostrarLink(i); }
  else if (i && id === 'iObs') i.obs = e.target.value;
  else return;
  salvar();
  if (i && id.charAt(0) === 'i') atualizarLinha(i);
  atualizarStatus();
});
document.addEventListener('change', function(e){
  var i = item();
  if (i && e.target.id === 'iDestino') { i.destino = e.target.value; salvar(); atualizarLinha(i); atualizarStatus(); }
});

/* Arrastar pelo ⋮⋮ (mouse e dedo): mostra a linha onde o item vai cair. */
var arrasto = null;
document.addEventListener('pointerdown', function(e){
  var g = e.target.closest('[data-grip]'); if (!g) return;
  var li = g.closest('[data-item]'); e.preventDefault();
  arrasto = {id: li.dataset.item, li: li, alvo: null, depois: false};
  li.classList.add('dragging');
  try { g.setPointerCapture(e.pointerId); } catch (x) {}
});
document.addEventListener('pointermove', function(e){
  if (!arrasto) return;
  document.querySelectorAll('.dropBefore,.dropAfter').forEach(function(n){ n.classList.remove('dropBefore', 'dropAfter'); });
  var lis = Array.prototype.slice.call(document.querySelectorAll('#itens [data-item]'));
  var alvo = null, depois = false;
  lis.forEach(function(n){ var r = n.getBoundingClientRect(); if (e.clientY >= r.top - 3 && e.clientY <= r.bottom + 3) { alvo = n; depois = e.clientY > r.top + r.height / 2; } });
  if (!alvo && lis.length) { var ult = lis[lis.length - 1]; if (e.clientY > ult.getBoundingClientRect().bottom) { alvo = ult; depois = true; } }
  if (!alvo && lis.length) { var pri = lis[0]; if (e.clientY < pri.getBoundingClientRect().top) { alvo = pri; depois = false; } }
  arrasto.alvo = alvo; arrasto.depois = depois;
  if (alvo && alvo !== arrasto.li) alvo.classList.add(depois ? 'dropAfter' : 'dropBefore');
});
function fimArrasto(){
  if (!arrasto) return;
  var a = arrasto; arrasto = null;
  a.li.classList.remove('dragging');
  document.querySelectorAll('.dropBefore,.dropAfter').forEach(function(n){ n.classList.remove('dropBefore', 'dropAfter'); });
  if (!a.alvo || a.alvo === a.li) return;
  var c = culto();
  var para = c.itens.findIndex(function(i){ return i.id === a.alvo.dataset.item; }) + (a.depois ? 1 : 0);
  moverItem(a.id, para);
}
document.addEventListener('pointerup', fimArrasto);
document.addEventListener('pointercancel', fimArrasto);

var cfg = window.PL_FIREBASE;
if (cfg && cfg.apiKey && cfg.projectId) {
  /* Na conta, o que vale é o que está no Firestore (o cache do modo de teste não entra). */
  db = {cultos: []};
  store.save = function(){};
  iniciarNuvem(cfg);
} else {
  if (ui.cultoId && culto() && innerWidth > 900) ui.view = 'roteiro';
  else if (!culto()) ui.cultoId = null;
  render();
}
})();
</script>
