        '<button class="btn link small" data-trocarmusica>Trocar</button></div></div>';
    }
  },
  buscar: function(i){
    var campo = document.getElementById('iTitulo'), res = document.getElementById('bRes');
    if (!campo || !res) return;
    var q = semAcento(campo.value);
    if (!q) {
      res.innerHTML = banco.lista.length ? '' : banco.semPermissao ? '<div class="msg bad" style="padding:6px 2px">O banco de músicas está sem permissão: cole as regras novas (firestore.rules) no console do Firebase.</div>' :
        '<div class="muted small" style="padding:6px 2px">O banco ainda está vazio: abra a Projeção (versão nova) conectada à conta e ela envia a biblioteca de músicas.</div>';
      return;
    }
    var termos = q.split(' ');
    var achados = [];
    banco.lista.forEach(function(m){
      var tudo = m.nt + ' ' + m.na + ' ' + m.nl, nota = 0;
      if (m.nt.indexOf(q) === 0) nota = 4; else if (m.nt.indexOf(q) >= 0) nota = 3;
      else if (m.nl.indexOf(q) >= 0) nota = 2;
      else if (termos.every(function(t){ return tudo.indexOf(t) >= 0; })) nota = 1;
      if (nota) achados.push({m: m, nota: nota});
    });
    achados.sort(function(a, b){ return b.nota - a.nota || a.m.titulo.localeCompare(b.m.titulo, 'pt'); });
    var h = '<div class="sec">No banco da igreja</div>';
    h += achados.length ? achados.slice(0, 8).map(function(x){
      var m = x.m;
      return '<button class="r" data-musica="' + esc(m.id) + '">' + (m.capa ? '<img class="capa" src="' + esc(m.capa) + '" alt="">' : '<div class="capa">♪</div>') +
        '<div style="min-width:0;flex:1"><div class="t">' + esc(m.titulo) + '</div>' + (m.artista ? '<div class="a">' + esc(m.artista) + '</div>' : '') +
        '<div class="l">' + banco.trecho(m, q, termos) + '</div></div></button>';
    }).join('') : '<div class="muted small" style="padding:4px 2px">Nenhuma música do banco tem esse nome ou trecho. Se for nova, continue: cole a letra embaixo.</div>';
    h += '<div class="sec">Música nova · catálogo (a letra vem do LRCLIB)</div><div id="bApple"><div class="muted small" style="padding:4px 2px">Procurando…</div></div>';
    res.innerHTML = h;
    banco.catalogo(campo.value.trim());
  },
  /* A linha da letra onde está o trecho (com o trecho marcado); sem trecho, o começo da letra. */
  trecho: function(m, q, termos){
    var linhas = m.letra.split('\n'), alvo = '';
    for (var k = 0; k < linhas.length; k++) { if (semAcento(linhas[k]).indexOf(q) >= 0) { alvo = linhas[k]; break; } }
    if (!alvo) for (var j = 0; j < linhas.length; j++) { if (semAcento(linhas[j]).indexOf(termos[0]) >= 0) { alvo = linhas[j]; break; } }
    if (!alvo) alvo = linhas.filter(function(l){ return l.trim(); }).slice(0, 2).join(' / ');
    var limpo = esc(alvo);
    var base0 = semAcento(alvo), em = base0.indexOf(q);
    if (em >= 0 && base0.length === alvo.length) return esc(alvo.slice(0, em)) + '<mark>' + esc(alvo.slice(em, em + q.length)) + '</mark>' + esc(alvo.slice(em + q.length));
    termos.forEach(function(t){
      if (t.length < 3) return;
      /* marca a palavra mesmo com acento: compara letra a letra sem acento */
      var base = semAcento(alvo), at = base.indexOf(t);
      if (at >= 0 && base.length === alvo.length) limpo = esc(alvo.slice(0, at)) + '<mark>' + esc(alvo.slice(at, at + t.length)) + '</mark>' + esc(alvo.slice(at + t.length));
    });
    return limpo;
  },
  catalogo: function(termo){
    clearTimeout(banco.appleTimer);
    if (termo.length < 3) { var b = document.getElementById('bApple'); if (b) b.innerHTML = ''; return; }
    banco.appleTimer = setTimeout(function(){
      var nome = 'plApple' + Date.now();
      var s = document.createElement('script');
      window[nome] = function(r){
        delete window[nome]; s.remove();
        banco.apple = (r && r.results || []).map(function(x){ return {titulo: x.trackName || '', artista: x.artistName || '', album: x.collectionName || '', duracao: Math.round((x.trackTimeMillis || 0) / 1000), capa: String(x.artworkUrl100 || '').replace('100x100', '300x300')}; });
        banco.mostrarApple();
      };
      s.onerror = function(){ delete window[nome]; s.remove(); var b = document.getElementById('bApple'); if (b) b.innerHTML = '<div class="muted small" style="padding:4px 2px">Catálogo indisponível agora.</div>'; };
      s.src = 'https://itunes.apple.com/search?media=music&entity=song&country=BR&limit=6&term=' + encodeURIComponent(termo) + '&callback=' + nome;
      document.body.appendChild(s);
    }, 450);
  },
  mostrarApple: function(){
    var b = document.getElementById('bApple'); if (!b) return;
    b.innerHTML = banco.apple.length ? banco.apple.map(function(x, k){
      return '<button class="r" data-apple="' + k + '">' + (x.capa ? '<img class="capa" src="' + esc(x.capa) + '" alt="" loading="lazy">' : '<div class="capa">♪</div>') +
        '<div style="min-width:0;flex:1"><div class="t">' + esc(x.titulo) + '</div><div class="a">' + esc(x.artista) + '</div></div></button>';
    }).join('') : '<div class="muted small" style="padding:4px 2px">Nada no catálogo.</div>';
  },
  semPermissao: false,
  escolher: function(id){
    var i = item(), m = banco.achar(id); if (!i || !m) return;
    i.musicaId = m.id; i.showId = m.showId || ''; i.titulo = m.titulo; i.artista = m.artista; i.capa = m.capa; i.letra = ''; i.cifra = m.cifra || ''; ui.cand = null;
    salvar(); atualizarLinha(i); atualizarStatus(); renderEditor();
  },
  escolherApple: function(k){
    var i = item(), x = banco.apple[k]; if (!i || !x) return;
    i.musicaId = ''; i.showId = ''; i.titulo = x.titulo; i.artista = x.artista; i.capa = x.capa;
    ui.semBusca = i.id; ui.letraNota = ''; ui.cand = {itemId: i.id, lista: [], idx: 0, estado: 'buscando'};
    salvar(); atualizarLinha(i); atualizarStatus(); renderEditor();
    banco.letras(x).then(function(lista){
      if (!ui.cand || ui.cand.itemId !== i.id) return;
      ui.cand.lista = lista; ui.cand.estado = lista.length ? 'pronto' : 'vazio';
      if (item() && item().id === i.id) renderEditor();
    });
  },
  /* Prévia da letra encontrada: o diretor confere antes de usar (pode vir outra música com o mesmo nome). */
  candidato: function(i){
    var c = ui.cand; if (!c || c.itemId !== i.id) return '';
    if (c.estado === 'buscando') return '<div class="cand"><div class="muted small">Buscando a letra…</div></div>';
    if (c.estado === 'vazio' || c.idx >= c.lista.length) return '<div class="cand"><div class="muted small">' + (c.lista.length ? 'Acabaram as letras encontradas.' : 'Não achei a letra desta música.') + ' Cole a letra abaixo.</div><div class="acoes"><button class="btn small" data-cand="fechar">OK</button></div></div>';
    var x = c.lista[c.idx];
    return '<div class="cand"><div class="muted small">Letra ' + (c.idx + 1) + ' de ' + c.lista.length + ' · LRCLIB · ' + esc(x.faixa) + (x.artista ? ' — ' + esc(x.artista) : '') + '</div>' +
      '<div class="previa">' + esc(x.texto) + '</div>' +
      '<div class="acoes"><button class="btn primary small" data-cand="usar">Usar esta letra</button>' +
      (c.idx + 1 < c.lista.length ? '<button class="btn small" data-cand="proxima">Não é essa › próxima</button>' : '') +
      '<button class="btn link small" data-cand="fechar">Nenhuma, vou colar</button></div></div>';
  },
  acaoCandidato: function(acao){
    var i = item(), c = ui.cand; if (!i || !c) return;
    if (acao === 'usar') {
      i.letra = c.lista[c.idx].texto; ui.cand = null;
      ui.letraNota = 'Letra do LRCLIB (base aberta). Ao publicar, ela entra no banco da igreja e vai sozinha para a Projeção.';
      salvar(); atualizarLinha(i); atualizarStatus();
    } else if (acao === 'proxima') c.idx++;
    else ui.cand = null;
    renderEditor();
  },
  /* As letras no LRCLIB: a gravação exata (nome, artista, álbum e duração) primeiro, depois as buscas.
   * Cada letra aparece uma vez só. */
  letras: function(x){
    var base = 'https://lrclib.net/api/', head = {headers: {'Lrclib-Client': 'Projeto Live Diretor (https://github.com/denysondetrano30/projeto-live-diretor)'}};
    var limpa = function(t){ return String(t || '').replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim(); };
    var pega = function(url){ return fetch(url, head).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); };
    var lista = [], vistos = {};
    var junta = function(a){
      if (!a || !a.plainLyrics) return;
      var texto = limpa(a.plainLyrics), chave = semAcento(texto).slice(0, 200);
      if (!texto || vistos[chave]) return;
      vistos[chave] = 1; lista.push({texto: texto, faixa: a.trackName || a.name || '', artista: a.artistName || ''});
    };
    var exata = base + 'get?track_name=' + encodeURIComponent(x.titulo) + '&artist_name=' + encodeURIComponent(x.artista) +
      (x.album ? '&album_name=' + encodeURIComponent(x.album) : '') + (x.duracao ? '&duration=' + x.duracao : '');
    return pega(exata).then(function(d){
      junta(d);
      return pega(base + 'search?track_name=' + encodeURIComponent(x.titulo) + '&artist_name=' + encodeURIComponent(x.artista));
    }).then(function(l){
      (l || []).forEach(junta);
      if (lista.length >= 3) return null;
      return pega(base + 'search?q=' + encodeURIComponent(x.titulo));
    }).then(function(l){
      (l || []).forEach(junta);
      return lista.slice(0, 8);
    });
  },
  trocar: function(){
    var i = item(); if (!i) return;
    i.musicaId = ''; i.showId = ''; salvar(); atualizarLinha(i); atualizarStatus(); renderEditor();
  },
  /* Ao publicar: cada música com letra colada que ainda não está no banco vira uma música do banco. */
  guardarNovas: function(c){
    if (!nuvem.user) return;
    var agora = new Date().toISOString();
    c.itens.forEach(function(i){
      if (i.tipo !== 'musica') return;
      /* Cifra colada no campo Letra: passa para o campo Cifra e a letra fica só com o texto. */
      if (!(i.cifra || '').trim() && pareceCifra(i.letra)) { i.cifra = i.letra; i.letra = cifraParaLetra(i.cifra); }
      var cifra = (i.cifra || '').trim();
      if (i.musicaId) {
        /* Música do banco que ganhou (ou mudou) a cifra: o banco guarda e a Projeção põe os acordes
         * (mesmo se a lista do banco ainda não carregou aqui). */
        var m = banco.achar(i.musicaId);
        if (cifra && cifra !== ((m && m.cifra) || i.cifraEnviada || '').trim())
          { i.cifraEnviada = cifra; nuvem.m.setDoc(nuvem.m.doc(nuvem.fs, 'musicas', i.musicaId), {owner: nuvem.user.uid, cifra: cifra, pendente: true, atualizadoEm: agora}, {merge: true}).catch(function(e){ console.warn('banco de músicas', e); }); }
        return;
      }
      if (!(i.letra || '').trim() && cifra) i.letra = cifraParaLetra(cifra);
      if (!(i.letra || '').trim()) return;
      var id = nuvem.user.uid + '_d_' + uid();
      i.musicaId = id;
      nuvem.m.setDoc(nuvem.m.doc(nuvem.fs, 'musicas', id), {owner: nuvem.user.uid, titulo: i.titulo || 'Música', artista: i.artista || '', capa: i.capa || '',
        letra: i.letra, cifra: cifra, origem: 'diretor', pendente: true, apagada: false, atualizadoEm: agora}).catch(function(e){ console.warn('banco de músicas', e); });
    });
  }
};

/* ---------------- conferência antes do culto (decidida com ela em 26/11) ----------------
 * Botão "Conferir" no topo do culto. Confere sozinho: letras e arquivos de cada item, versão vertical
 * das imagens e vídeos que vão para a live (destino "midia"), se a última mudança foi publicada e,
 * no dia do culto, se o somun live e o somun tela já foram abertos (sinais/<conta>, o sinal de vida).
 * Mais a lista da própria igreja (perfis/<conta>.conferencia, uma linha por item), marcada à mão em
 * cada culto (c.conferido = {texto: true}, guardado junto do culto). */
var conf = {
  lista: [], sinal: null, aberto: false,
  carregar: function(){
    if (!nuvem.user) return;
    var F = nuvem.m, fs = nuvem.fs, u = nuvem.user.uid;
    F.getDoc(F.doc(fs, 'perfis', u)).then(function(d){
      var x = d.exists() ? d.data() : {};
      conf.lista = Array.isArray(x.conferencia) ? x.conferencia : [];
      conf.atualizarBotao();
    }, function(){});
    conf.lerSinal();
  },
  lerSinal: function(depois){
    if (!nuvem.user) return;
    var F = nuvem.m;
    F.getDoc(F.doc(nuvem.fs, 'sinais', nuvem.user.uid)).then(function(d){
      conf.sinal = d.exists() ? d.data() : {};
      conf.atualizarBotao(); if (depois) depois();
    }, function(){ conf.sinal = null; if (depois) depois(); });
  },
  hoje: function(ts){
    var d = ts && ts.toDate ? ts.toDate() : (typeof ts === 'string' ? new Date(ts) : null);
    return !!d && !isNaN(d) && d.toDateString() === new Date().toDateString();
  },
  /* [{texto, ok, item?, mao?, neutro?}] — neutro = só informação, não conta como pendente */
  itens: function(c){
    var l = [], faltas = [], verticais = [], temLive = false;
    c.itens.forEach(function(i, k){
      var nome = 'Item ' + (k + 1) + ' · ' + (i.titulo || TIPOS[i.tipo].nome);
      if (i.tipo === 'imagem' || i.tipo === 'video') {
        if (lerDrive(i.link).estado !== 'ok') faltas.push({texto: nome + ': falta o arquivo', ok: false, item: i.id});
        if (i.destino === 'midia') {
          temLive = true;
          if (lerDrive(i.vertical).estado !== 'ok') verticais.push({texto: nome + ': falta a versão vertical', ok: false, item: i.id});
        }
      } else if (i.tipo === 'texto' && !(i.letra || '').trim()) {
        faltas.push({texto: nome + ': falta o texto', ok: false, item: i.id});
      } else if (i.tipo === 'musica' && !i.musicaId && !(i.letra || '').trim()) {
        faltas.push({texto: nome + ': sem letra (a Projeção procura pelo título na biblioteca dela)', ok: false, item: i.id});
      }
    });
    if (!c.itens.length) l.push({texto: 'Roteiro vazio', ok: false});
    else l = l.concat(faltas.length ? faltas : [{texto: 'Letras e arquivos completos', ok: true}]);
    if (temLive) l = l.concat(verticais.length ? verticais : [{texto: 'Versões verticais completas', ok: true}]);
    var u = ultima(c);
    if (!u) l.push({texto: 'Ainda não foi publicado para a Projeção', ok: false});
    else if (mudou(c)) l.push({texto: 'Mudou depois da v' + u.n + ': falta publicar', ok: false});
    else l.push({texto: 'Publicado para a Projeção (v' + u.n + ')', ok: true});
    if (nuvem.user) {
      if (c.data !== hojeISO()) l.push({texto: 'No dia do culto, confere aqui se o somun live e o somun tela foram abertos', neutro: true});
      else if (!conf.sinal) l.push({texto: 'Não deu para ver se o somun live e o somun tela foram abertos hoje', neutro: true});
      else {
        l.push(conf.hoje(conf.sinal.live && conf.sinal.live.em) ? {texto: 'somun live aberto hoje', ok: true} : {texto: 'somun live ainda não foi aberto hoje', ok: false});
        l.push(conf.hoje(conf.sinal.tela && conf.sinal.tela.em) ? {texto: 'somun tela aberto hoje', ok: true} : {texto: 'somun tela ainda não foi aberto hoje', ok: false});
      }
    }
    var marcados = c.conferido || {};
    conf.lista.forEach(function(t){ l.push({texto: t, ok: !!marcados[t], mao: true}); });
    return l;
  },
  faltam: function(c){ return conf.itens(c).filter(function(x){ return !x.neutro && !x.ok; }).length; },
  rotulo: function(c){ var n = conf.faltam(c); return n ? 'Conferir · ' + n : 'Conferido ✓'; },
  atualizarBotao: function(){
    var c = culto(); if (!c) return;
    var t = conf.rotulo(c);
    document.querySelectorAll('[data-conferir]').forEach(function(b){ b.textContent = t; });
    if (conf.aberto) conf.desenhar();
  },
  abrir: function(){
    var c = culto(); if (!c) return;
    conf.fechar();
    var bg = document.createElement('div'); bg.className = 'dialogBg'; bg.id = 'confBg';
    bg.innerHTML = '<div class="dialog conf" role="dialog" aria-modal="true" aria-label="Conferência antes do culto"></div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){ if (e.target === bg) conf.fechar(); });
    conf.aberto = true; conf.editando = false;
    conf.desenhar();
    conf.lerSinal();
  },
  fechar: function(){ var bg = document.getElementById('confBg'); if (bg) bg.remove(); conf.aberto = false; },
  desenhar: function(){
    var c = culto(), box = document.querySelector('#confBg .dialog'); if (!c || !box) return;
    var l = conf.itens(c), auto = l.filter(function(x){ return !x.mao; }), mao = l.filter(function(x){ return x.mao; });
    var marca = function(x){ return '<span class="cfMark ' + (x.neutro ? 'neutro' : x.ok ? 'ok' : 'falta') + '" aria-hidden="true">' + (x.neutro ? '·' : x.ok ? '✓' : '') + '</span>'; };
    var h = '<div style="display:flex;align-items:center;gap:8px"><div style="font-weight:700;font-size:16px;flex:1">Conferência · ' + esc(c.nome || 'Culto') + '</div><button class="btn link" data-cf="fechar" aria-label="Fechar">✕</button></div>';
    h += '<div class="cfList">' + auto.map(function(x){
      return x.item ? '<button class="cfRow link" data-cf="item" data-id="' + x.item + '">' + marca(x) + '<span>' + esc(x.texto) + '</span></button>'
                    : '<div class="cfRow' + (x.neutro ? ' muted' : '') + '">' + marca(x) + '<span>' + esc(x.texto) + '</span></div>';
    }).join('') + '</div>';
    if (nuvem.user) {
      h += '<div class="muted small" style="letter-spacing:.5px;display:flex;align-items:center;gap:8px"><span style="flex:1">DA IGREJA</span><button class="btn link small" data-cf="editar">' + (conf.editando ? 'Pronto' : (conf.lista.length ? 'Mudar a lista' : 'Criar a lista')) + '</button></div>';
      if (conf.editando) {
        h += '<textarea id="cfLista" style="min-height:140px" placeholder="Uma coisa por linha. Ex.:\nPilhas dos microfones\nSom testado com a banda\nCâmeras carregadas">' + esc(conf.lista.join('\n')) + '</textarea>';
      } else if (!mao.length) {
        h += '<div class="muted small">Coisas que a sua igreja sempre confere (pilhas, som, câmeras...). Escreva uma vez e marque em cada culto.</div>';
      } else {
        h += '<div class="cfList">' + mao.map(function(x){
          return '<label class="cfRow"><input type="checkbox" data-cf-mao="' + esc(x.texto) + '"' + (x.ok ? ' checked' : '') + '><span>' + esc(x.texto) + '</span></label>';
        }).join('') + '</div>';
      }
    }
    box.innerHTML = h;
  },
  salvarLista: function(){
    var ta = document.getElementById('cfLista'); if (!ta) return;
    var nova = ta.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean)
      .filter(function(s, k, a){ return a.indexOf(s) === k; }).slice(0, 60);
    conf.lista = nova;
    equipe.perfil({conferencia: nova});
  }
};
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-cf]'); if (!b || !conf.aberto) return;
  var a = b.dataset.cf;
  if (a === 'fechar') conf.fechar();
  else if (a === 'editar') { if (conf.editando) conf.salvarLista(); conf.editando = !conf.editando; conf.desenhar(); conf.atualizarBotao(); var ta = document.getElementById('cfLista'); if (ta) ta.focus(); }
  else if (a === 'item') { conf.fechar(); ui.itemId = b.dataset.id; ui.tarefaId = null; ui.view = 'item'; render(); }
});
document.addEventListener('change', function(e){
  var t = e.target; if (!t.dataset || t.dataset.cfMao === undefined) return;
  var c = culto(); if (!c) return;
  c.conferido = Object.assign({}, c.conferido || {});
  if (t.checked) c.conferido[t.dataset.cfMao] = true; else delete c.conferido[t.dataset.cfMao];
  salvar(); conf.atualizarBotao();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && conf.aberto) conf.fechar(); });

/* ---------------- equipe e escala (só equipe de mídia; decisões de 15/11) ----------------
 * equipe/<código>: uma pessoa {owner, nome, whatsapp, funcoes[], indisponivel[datas],
 *   escalas{chave:{cultoId, culto, data, hora, funcao, atribuidoEm}}, respostas{chave:{estado, motivo, em}}}
 *   O código (longo e aleatório) é o link pessoal: a pessoa abre ?e=<código> sem senha, vê as escalas,
 *   responde e marca os dias que não pode (as regras só deixam ela mudar respostas e indisponivel).
 * escalas/<cultoId>: {owner, culto{nome,data,hora}, vagas[{id, funcao, pessoa}]}
 * perfis/<uid>: funcoes[] e modeloEscala[] (as vagas que todo culto novo começa tendo). */
var FUNCOES = ['Projeção', 'Transmissão', 'Câmera', 'Som', 'Fotos'];
var MODELO = ['Projeção', 'Transmissão', 'Câmera'];
var DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
function codigo(){ var a = new Uint8Array(18), t = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', s = ''; crypto.getRandomValues(a); a.forEach(function(n){ s += t[n % t.length]; }); return s; }
function linkPessoal(id){ return location.origin + location.pathname + '?e=' + id; }

 *   grupos (antigo, só leitura: os links dos grupos aparecem nos materiais)}
 * demandas/<id> ("tarefas" na tela): {owner, titulo, tipo, evento | culto, pessoa, prazo, obs,
 *   estado (a_fazer|fazendo|para_aprovar|ajustar|pronto), estadoEm (quando o diretor mudou),
 *   retorno (recado do ajuste), ajusteEm, criadoEm, aprovadoEm}

function tipoPeloTitulo(t){
  t = semAcento(t);
  if (/reels|stories em video/.test(t)) return 'Reels';
  if (/video|aftermovie|teaser|clipe/.test(t)) return 'Vídeo';
  if (/foto/.test(t)) return 'Fotos';
  if (/depoimento|testemunho/.test(t)) return 'Depoimento';
  if (/arte|post|feed|stories|flyer|banner|capa|thumb|card/.test(t)) return 'Arte';
  return 'Outro';
}

    plano.eventos.forEach(function(ev){
      if (ev.inicio) {
        var d = new Date(ev.inicio + 'T12:00'), fim = new Date((ev.fim || ev.inicio) + 'T12:00');
        for (var k = 0; d <= fim && k < 60; k++, d = new Date(d.getTime() + 864e5)) poe(iso(d), '<button class="tag evento" data-pl="evento" data-id="' + ev.id + '">' + esc(ev.nome) + '</button>');
      }
      (ev.marcos || []).forEach(function(mk){ if (mk.data) poe(mk.data, '<button class="tag marco" data-pl="evento" data-id="' + ev.id + '">' + esc(mk.nome) + '</button>'); });
    });
    plano.demandas.forEach(function(d){

    });

      '<div style="font-weight:700;font-size:18px">' + MESES[m].charAt(0).toUpperCase() + MESES[m].slice(1) + ' ' + ano + '</div><button class="btn small" data-pl="mes" data-d="1">›</button></div>' +
      '<div class="mes">' + DIAS.map(function(d){ return '<div class="dn">' + d + '</div>'; }).join('');
    for (var i = 0; i < 42; i++) {
      var dia = new Date(ini.getTime() + i * 864e5 + 12 * 3600e3), di = iso(dia);
      h += '<div class="dia' + (dia.getMonth() !== m ? ' fora' : '') + (di === hoje ? ' hoje' : '') + '" data-dia="' + di + '"><span class="n">' + dia.getDate() + '</span>' + (porDia[di] || []).join('') + '</div>';
    }

        var inp = document.getElementById('ntTexto'), ok = inp.closest('.dialog').querySelector('[data-ok]'); inp.focus();

  usarNoCulto: function(cultoId, link){

  /* ---- ações ---- */

    var a = b.dataset.pl, ev = plano.evento(ui.eventoId), dd = b.dataset.id && plano.demanda(b.dataset.id);

    else if (a === 'mes') { var d = new Date(+plano.mes.slice(0, 4), +plano.mes.slice(5, 7) - 1 + (+b.dataset.d), 1); plano.mes = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); plano.desenhar(); }
    else if (a === 'culto') { plano.fechar(); ui.redes = false; ui.cultoId = b.dataset.id; ui.eventoId = null; ui.itemId = null; ui.tarefaId = null; ui.view = 'roteiro'; render(); }
    else if (a === 'evento') { plano.fechar(); ui.redes = false; ui.eventoId = b.dataset.id; ui.cultoId = null; ui.itemId = null; ui.tarefaId = null; ui.view = 'roteiro'; render(); }
    else if (a === 'tarefa') plano.abrirTarefa(b.dataset.id);
    else if (a === 'calendario') plano.abrir('calendario');
    else if (a === 'quadro') plano.abrir('quadro');
    else if (a === 'novo') {
      var r = b.getBoundingClientRect();

    }
    else if (a === 'prazoAntes') { var td = plano.demanda(ui.tarefaId); if (td) { plano.salvarDemanda(Object.assign({}, td, {prazo: iso(new Date(new Date(b.dataset.data + 'T12:00').getTime() - 3 * 864e5))}), td); renderEditor(); } }
    else if (a === 'apagarDemanda' && dd) dialogo('Apagar a tarefa?', esc(dd.titulo), 'Apagar', function(){ plano.apagarDemanda(dd); if (ui.view === 'item') ui.view = 'roteiro'; render(); });

      plano.eventos = plano.eventos.filter(function(x){ return x.id !== ev.id; });
      nuvem.m.deleteDoc(nuvem.m.doc(nuvem.fs, 'eventos', ev.id)); ui.eventoId = null; ui.tarefaId = null; ui.view = 'cultos'; render(); });
    else if (a === 'tirarMarco' && ev) { ev.marcos.splice(+b.dataset.k, 1); plano.salvarEvento(ev); renderEvento(); }
    else if (a === 'usar' && ev) { var mt = plano.materiais(ev)[+b.dataset.m]; if (mt) plano.escolherCulto(mt); }
    else if (a === 'emPe' && ev) {
      var mp = plano.materiais(ev)[+b.dataset.m]; if (!mp) return true;
      pedirLink('Versão vertical de "' + (mp.titulo || 'Material') + '"', 'Link do Google Drive do arquivo vertical (9:16), para a transmissão vertical. Deixe vazio para tirar.', mp.vertical, function(v){
        ev.verticais = Object.assign({}, ev.verticais || {});

        plano.salvarEvento(ev); renderEvento(); renderCultos();

    }
    else if (a === 'tirarLink' && ev) {
      var tl = b.dataset.t;
      if (tl.charAt(0) === 'l') { var saiu = ev.links.splice(+tl.slice(1), 1)[0]; if (saiu && ev.verticais) delete ev.verticais[saiu.url]; }
      else { var pg = tl.slice(1).split('_'); ev.grupos[+pg[0]].links.splice(+pg[1], 1); }
      plano.salvarEvento(ev); renderEvento();
    }
    else return false;
    return true;
  },
  mudanca: function(t){
    if (t.dataset.tcampo) { plano.mudarTarefa(t); return true; }
    var ev = plano.evento(ui.eventoId);
    if (t.dataset.ecampo && ev) {

    } else if (tipo === 'link' && ev) {

      var lv = document.getElementById('lkV'), vurl = lv ? lv.value.trim() : '';

      ev.links = (ev.links || []).concat([{id: uid(), titulo: tl || 'Material', url: url}]);
      if (vurl) { ev.verticais = Object.assign({}, ev.verticais || {}); ev.verticais[url] = vurl; }
      plano.salvarEvento(ev); renderEvento(); renderCultos();
    }
  }
};

      '<div class="muted small" style="margin-top:4px">Abertura, arte da célula, avisos que ficam várias semanas. Guarde uma vez (horizontal e vertical) e use em qualquer culto.</div></div></div>' +
      '<div class="secao"><div class="lblSec">Arquivos</div>' + (mats.length ? mats.map(linhaMat).join('') : '<div class="muted small">Nenhum arquivo ainda. Cole abaixo o link do Drive (e o vertical, se tiver).</div>') + formLink + '</div>';
    return;
  }
  var h = '<button class="btn link back" data-voltar="cultos">‹ Agenda</button>' +

    '<div class="when"><input type="date" id="evI" data-ecampo="inicio" aria-label="Começa" value="' + esc(ev.inicio || '') + '"><span class="muted">até</span><input type="date" id="evF" data-ecampo="fim" aria-label="Termina" value="' + esc(ev.fim || '') + '"></div></div></div>' +
    '<div class="secao"><div class="lblSec">Datas importantes</div><div class="fchips">' + (ev.marcos || []).map(function(mk, k){
      return '<span class="marcoChip"><b>' + esc(mk.data.slice(8, 10) + '/' + mk.data.slice(5, 7)) + '</b> ' + esc(mk.nome) + '<button data-pl="tirarMarco" data-k="' + k + '" title="Tirar">×</button></span>'; }).join('') + '</div>' +
    '<form class="addTarefa" data-plform="marco"><input id="mkNome" placeholder="Ex.: Inscrições abrem" autocomplete="off" required><input id="mkData" type="date" required><button class="btn">Adicionar</button></form></div>' +
    plano.htmlTarefas('evento', ev.id) +

    (mats.length ? mats.map(linhaMat).join('')
      : '<div class="muted small">As entregas aprovadas das tarefas aparecem aqui sozinhas. Também dá para colar um link do Drive.</div>') +

function iso(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* ---------------- ao vivo (bloco 6) ----------------
 * Durante o culto, pela conta:
 * - "Agora no telão": a Projeção escreve em aoVivo/<culto>.agora o item que está no telão;
 * - recados: o diretor manda para Todos, Projeção ou Transmissão (respostas prontas ou texto);
 *   a resposta da Projeção aparece na conversa;
 * - sugestões de mídia: link do Drive + onde entra; a Projeção baixa e o operador insere ou descarta.
 * Tudo fica em aoVivo/<culto>/eventos. */
var RESPOSTAS = ['Próximo item', 'Espera', 'Plano geral', 'Volta pra letra'];
var PARA = {todos: 'Todos', projecao: 'Projeção', transmissao: 'Transmissão'};
var ESTADO = {enviada: 'Enviada, esperando a Projeção', baixando: 'A Projeção está baixando', na_fila: 'Pronta na Projeção, o operador decide', inserida: 'Inserida no culto', descartada: 'O operador descartou', erro: 'Não deu'};
var aoVivo = {
  id: null, agora: null, eventos: [], para: 'todos', respostas: RESPOSTAS.slice(), parar: [], relogio: null,
  abrir: function(){
    var c = culto(); if (!c || !nuvem.user) return;
    var F = nuvem.m, fs = nuvem.fs, uidU = nuvem.user.uid;
    aoVivo.fechar();
    aoVivo.id = c.id; aoVivo.agora = null; aoVivo.eventos = [];
    var el = document.getElementById('aovivo');
    el.style.display = 'flex';
    el.innerHTML = '<div class="bar"><button class="btn link" data-lvfechar>‹ Roteiro</button><span class="pulse"></span><span class="t">Ao vivo · ' + esc(c.nome || 'Culto') + '</span><span class="muted small" id="lvNet"></span></div>' +
      '<div class="wrap">' +
      '<div class="card agora full" id="lvAgora"></div>' +
      '<div class="card"><div class="lbl">Recados</div>' +
        '<div class="chips" id="lvPara"></div>' +
        '<div class="chips" id="lvResp"></div>' +
        '<form class="send" id="lvForm"><input id="lvTexto" placeholder="Escreva um recado" autocomplete="off"><button class="btn primary">Enviar</button></form>' +
        '<div class="muted small" id="lvParaNota"></div>' +
        '<div class="thread" id="lvThread"></div></div>' +
      '<div class="card"><div class="lbl">Sugerir mídia</div>' +
        '<div class="field"><input id="lvSTitulo" placeholder="Nome (ex.: Vídeo da campanha)"></div>' +
        '<div class="field"><input id="lvSLink" inputmode="url" placeholder="Link do Google Drive"><div class="msg" id="lvSMsg"></div></div>' +
        '<div class="field"><select id="lvSPos"></select></div>' +
        '<button class="btn primary" id="lvSEnviar">Enviar para a Projeção</button>' +
        '<div id="lvSug"></div></div>' +
      '</div>';
    aoVivo.chips(); aoVivo.posicoes(); aoVivo.desenhar();
    document.getElementById('lvForm').addEventListener('submit', function(e){ e.preventDefault(); var i = document.getElementById('lvTexto'); aoVivo.recado(i.value); i.value = ''; });
    document.getElementById('lvSLink').addEventListener('input', function(e){
      var r = lerDrive(e.target.value.trim()), m = document.getElementById('lvSMsg');
      m.className = 'msg ' + (r.estado === 'ok' ? 'ok' : e.target.value.trim() ? 'bad' : '');
      m.textContent = {ok: 'Link do Drive certo. Lembre: compartilhado como "Qualquer pessoa com o link".', pasta: 'Isso é uma pasta; abra o arquivo e copie o link dele.', naoDrive: 'Não parece um link de arquivo do Google Drive.', vazio: ''}[r.estado] || '';
    });
    document.getElementById('lvSEnviar').addEventListener('click', aoVivo.sugerir);
    el.addEventListener('click', aoVivo.clique);
    aoVivo.relogio = setInterval(aoVivo.desenharAgora, 5000);

    var ref = F.doc(fs, 'aoVivo', c.id);
    document.getElementById('lvNet').textContent = 'Conectando…';
    F.setDoc(ref, {owner: uidU}, {merge: true}).then(function(){
      if (aoVivo.id !== c.id) return;
      aoVivo.parar.push(F.onSnapshot(ref, {includeMetadataChanges: true}, function(d){
        var x = d.data() || {};
        aoVivo.agora = x.agora || null;
        document.getElementById('lvNet').textContent = d.metadata.fromCache ? 'Sem internet' : '';
        aoVivo.desenharAgora(); aoVivo.posicoes();
      }, function(e){ console.warn(e); document.getElementById('lvNet').textContent = 'Sem permissão (veja as regras)'; }));
      var desde = new Date(Date.now() - 12 * 60 * 60 * 1000).toISOString();
      var q = F.query(F.collection(fs, 'aoVivo', c.id, 'eventos'), F.where('em', '>', desde), F.orderBy('em'));
      aoVivo.parar.push(F.onSnapshot(q, function(snap){

/* Arrastar pelo ⋮⋮ (mouse e dedo): mostra a linha onde o item vai cair. */
var arrasto = null;
document.addEventListener('pointerdown', function(e){
  var g = e.target.closest('[data-grip]'); if (!g) return;
  var li = g.closest('[data-item]'); e.preventDefault();
  arrasto = {id: li.dataset.item, li: li, alvo: null, depois: false};
  li.classList.add('dragging');
  try { g.setPointerCapture(e.pointerId); } catch (x) {}
});
document.addEventListener('pointermove', function(e){
  if (!arrasto) return;
  document.querySelectorAll('.dropBefore,.dropAfter').forEach(function(n){ n.classList.remove('dropBefore', 'dropAfter'); });
  var lis = Array.prototype.slice.call(document.querySelectorAll('#itens [data-item]'));
  var alvo = null, depois = false;
  lis.forEach(function(n){ var r = n.getBoundingClientRect(); if (e.clientY >= r.top - 3 && e.clientY <= r.bottom + 3) { alvo = n; depois = e.clientY > r.top + r.height / 2; } });
  if (!alvo && lis.length) { var ult = lis[lis.length - 1]; if (e.clientY > ult.getBoundingClientRect().bottom) { alvo = ult; depois = true; } }
  if (!alvo && lis.length) { var pri = lis[0]; if (e.clientY < pri.getBoundingClientRect().top) { alvo = pri; depois = false; } }
  arrasto.alvo = alvo; arrasto.depois = depois;
  if (alvo && alvo !== arrasto.li) alvo.classList.add(depois ? 'dropAfter' : 'dropBefore');
});
function fimArrasto(){
  if (!arrasto) return;
  var a = arrasto; arrasto = null;
  a.li.classList.remove('dragging');
  document.querySelectorAll('.dropBefore,.dropAfter').forEach(function(n){ n.classList.remove('dropBefore', 'dropAfter'); });
  if (!a.alvo || a.alvo === a.li) return;
  var c = culto();
  var para = c.itens.findIndex(function(i){ return i.id === a.alvo.dataset.item; }) + (a.depois ? 1 : 0);
  moverItem(a.id, para);
}

function paginaPessoal(cfg, cod){

  Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-firestore.js')]).then(function(mods){
    F = mods[1];
    var fs = F.getFirestore(mods[0].initializeApp(cfg));
    ref = F.doc(fs, 'equipe', cod);
    F.onSnapshot(ref, function(d){ dados = d.exists() ? d.data() : null; desenhar(); },
      function(e){ console.warn(e); dados = null; desenhar(); });
  });
  function salvar(campos){ campos.vistoEm = new Date().toISOString(); F.updateDoc(ref, campos).catch(function(e){ console.warn(e); toast('Não deu para enviar. Confira a internet e tente de novo.'); }); }

    var hoje = hojeISO(), nomes = {pendente: 'Esperando sua resposta', confirmado: 'Você confirmou', recusado: 'Você avisou que não pode'};
    var lista = Object.keys(dados.escalas || {}).map(function(k){ return Object.assign({chave: k}, dados.escalas[k]); })
      .filter(function(e){ return e.data >= hoje; }).sort(function(a, b){ return (a.data + a.hora).localeCompare(b.data + b.hora); });

    h += '<div class="card full"><div class="lbl">Próximas escalas</div>';
    if (!lista.length) h += '<div class="muted">Nenhuma escala marcada por enquanto.</div>';

      var r = (dados.respostas || {})[e.chave], est = r && r.em >= e.atribuidoEm ? r.estado : 'pendente';
      h += '<div style="border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px">' +
        '<div><b>' + esc(e.funcao) + '</b> · ' + esc(e.culto) + '</div><div class="muted">' + esc(quando(e.data, e.hora)) + '</div>' +
        '<div><span class="estado ' + est + '">' + nomes[est] + (est === 'recusado' && r.motivo ? ': ' + esc(r.motivo) : '') + '</span></div>';
      if (motivoDe === e.chave) h += '<form class="send" data-pmotivo="' + e.chave + '"><input id="pMotivo" placeholder="Motivo (opcional)" autocomplete="off"><button class="btn primary">Enviar</button></form>';
      else h += '<div class="row" style="justify-content:flex-start;gap:8px"><button class="btn primary" data-presp="confirmado" data-k="' + e.chave + '">Confirmo</button>' +
        '<button class="btn" data-presp="recusado" data-k="' + e.chave + '">Não posso</button></div>';
      h += '</div>';
    });
    h += '</div>';
    /* demandas (artes, vídeos, fotos…) */
    var dem = Object.keys(dados.demandas || {}).map(function(k){ return Object.assign({id: k}, dados.demandas[k]); })
      .filter(function(d){ return d.estado !== 'pronto' || (d.prazo || '9') >= hoje; })
      .sort(function(a, b){ return (a.prazo || '9').localeCompare(b.prazo || '9'); });
    if (dem.length) {
      h += '<div class="card full"><div class="lbl">Minhas demandas</div>';
      dem.forEach(function(d){
        var en = (dados.entregas || {})[d.id], est = d.estado === 'pronto' ? 'pronto' : en && en.em >= (d.ajusteEm || '') ? en.estado : /^(ajustar|fazendo|para_aprovar)$/.test(d.estado) ? d.estado : 'a_fazer';
        var atras = est !== 'pronto' && d.prazo && d.prazo < hoje;
        h += '<div style="border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px">' +
          '<div><b>' + esc(d.titulo) + '</b> · ' + esc(d.tipo) + (d.evento ? ' · ' + esc(d.evento) : '') + '</div>' +
          '<div class="' + (atras ? 'msg bad' : 'muted') + '">' + (d.prazo ? 'Prazo: ' + esc(quando(d.prazo)) + (atras ? ' (atrasada)' : '') : 'Sem prazo') + '</div>' +
          (d.obs ? '<div class="muted small">' + esc(d.obs) + '</div>' : '') +
          '<div><span class="estado ' + est + '">' + ({a_fazer: 'A fazer', fazendo: 'Fazendo', para_aprovar: 'Enviada para aprovação', ajustar: 'Precisa de ajuste', pronto: 'Aprovada ✓'})[est] + '</span></div>' +
          (est === 'ajustar' && d.retorno ? '<div class="msg">Ajuste pedido: ' + esc(d.retorno) + '</div>' : '');
        if (est !== 'pronto') {
          if (est === 'a_fazer' || est === 'ajustar') h += '<div><button class="btn" data-pdem="fazendo" data-k="' + d.id + '">Comecei</button></div>';
          h += '<form class="send" data-pentrega="' + d.id + '" style="flex-wrap:wrap"><input id="pUrl_' + d.id + '" placeholder="Link da entrega (Google Drive)" inputmode="url" value="' + esc(en && en.url || '') + '" required>' +
            '<input id="pNota_' + d.id + '" placeholder="Recado (opcional)" value="' + esc(en && en.nota || '') + '"><button class="btn primary">Enviar para aprovação</button></form>';
        }
        h += '</div>';
      });
      h += '</div>';
    }
    var nao = (dados.indisponivel || []).filter(function(d){ return d >= hoje; }).sort();
    h += '<div class="card full"><div class="lbl">Dias que não posso servir</div>' +
      (nao.length ? '<div class="fchips">' + nao.map(function(d){ return '<button data-pnao="' + d + '" title="Tirar">' + esc(quando(d)) + ' ×</button>'; }).join('') + '</div>' : '<div class="muted small">Nenhum. Marque aqui os dias em que você não pode, para o diretor não te escalar.</div>') +
      '<form class="send" data-pdia><input id="pDia" type="date" min="' + hoje + '" required><button class="btn">Marcar</button></form></div>';
    w.innerHTML = h;
    if (motivoDe) { var m = document.getElementById('pMotivo'); if (m) m.focus(); }
  }
  el.addEventListener('click', function(e){
    var b = e.target.closest('[data-presp]');
    if (b) {
      if (b.dataset.presp === 'recusado') { motivoDe = b.dataset.k; desenhar(); return; }
      var c = {}; c['respostas.' + b.dataset.k] = {estado: 'confirmado', motivo: '', em: new Date().toISOString()}; salvar(c); return;
    }
    var n = e.target.closest('[data-pnao]'); if (n) salvar({indisponivel: F.arrayRemove(n.dataset.pnao)});
    var dm = e.target.closest('[data-pdem]');
    if (dm) { var c2 = {}; c2['entregas.' + dm.dataset.k] = {estado: 'fazendo', url: '', nota: '', em: new Date().toISOString()}; salvar(c2); }
  });
  el.addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target;
    if (f.dataset.pentrega) {
      var k = f.dataset.pentrega, url = document.getElementById('pUrl_' + k).value.trim(); if (!url) return;
      var c3 = {}; c3['entregas.' + k] = {estado: 'para_aprovar', url: url, nota: document.getElementById('pNota_' + k).value.trim(), em: new Date().toISOString()};
      salvar(c3); toast('Enviado para aprovação.'); return;
    }
    if (f.dataset.pmotivo) {
      var c = {}; c['respostas.' + f.dataset.pmotivo] = {estado: 'recusado', motivo: document.getElementById('pMotivo').value.trim(), em: new Date().toISOString()};
      motivoDe = null; salvar(c);
    } else if (f.hasAttribute('data-pdia')) {
      var d = document.getElementById('pDia').value; if (d) salvar({indisponivel: F.arrayUnion(d)});
    }
  });
}

var cfg = window.PL_FIREBASE;
var codigoPessoal = new URLSearchParams(location.search).get('e');
if (codigoPessoal && cfg && cfg.apiKey) {
  paginaPessoal(cfg, codigoPessoal);
} else if (cfg && cfg.apiKey && cfg.projectId) {
  /* Na conta, o que vale é o que está no Firestore (o cache do modo de teste não entra). */
  db = {cultos: []};
  store.save = function(){};
  iniciarNuvem(cfg);
} else {
  if (ui.cultoId && culto() && innerWidth > 900) ui.view = 'roteiro';
  else if (!culto()) ui.cultoId = null;
  render();
}
})();
</script>
</body>
</html>
