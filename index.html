<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>somun Diretor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%271%27 y=%271%27 width=%2762%27 height=%2762%27 rx=%2714%27 fill=%27%23232323%27 stroke=%27%233A3A3A%27 stroke-width=%272%27/%3E%3Ctext x=%2729%27 y=%2742%27 text-anchor=%27middle%27 font-family=%27Outfit,Arial,sans-serif%27 font-weight=%27800%27 font-size=%2730%27 fill=%27%23fff%27%3Eun%3C/text%3E%3Ccircle cx=%2750%27 cy=%2740%27 r=%274%27 fill=%27%23E5483B%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Identidade somun: preto, branco, cinza; vermelho só para o que está ao vivo ou atrasado. */
  --bg:#141414; --panel:#1c1c1c; --panel2:#232323; --line:#2a2a2a; --line2:#3a3a3a;
  --text:#f2f2f2; --muted:#a8a8a8; --blue:#ffffff; --blueSoft:#2a2a2a; --blueText:#ffffff;
  --amber:#f2f2f2; --green:#8c8c8c; --red:#e5483b; --sel:#d0d0d0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:1.5px;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:12px}
.cols{display:grid;grid-template-columns:260px 1fr 360px;flex:1;min-height:0}
.col{min-height:0;overflow:auto}
nav.cultos{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.btn{background:var(--line);color:var(--text);border:0;border-radius:8px;padding:0 14px;min-height:40px;font-weight:600}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#4a7cf0}
.btn.primary:disabled{background:#2a3350;color:#8b93ad;cursor:default}
.btn.ghost{background:transparent;border:1px dashed var(--line2);color:var(--muted);font-weight:500}
.btn.ghost:hover{color:var(--text);border-color:#55556a}
.btn.link{background:transparent;color:var(--muted);font-weight:500;padding:0 6px}
.btn.link:hover{color:var(--text)}
.month{color:var(--muted);font-size:11px;letter-spacing:.6px;margin:14px 6px 4px;text-transform:uppercase}
.culto{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 11px}
.culto:hover{background:var(--panel)}
.culto.on{background:var(--panel2);border-color:var(--line2)}
.culto .t{font-weight:600}
.culto .s{color:var(--muted);font-size:12px;margin-top:2px}
main.roteiro{padding:20px 26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.titleIn{background:transparent;border:1px solid transparent;border-radius:8px;font-size:22px;font-weight:700;padding:4px 6px;margin-left:-7px;width:100%}
.titleIn:hover{border-color:var(--line)}
.titleIn:focus{outline:none;border-color:var(--sel);background:var(--panel)}
.when{display:flex;gap:8px;align-items:center;margin-top:4px}
.when input{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;color-scheme:dark}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.hint{color:var(--muted);font-size:12px;letter-spacing:.3px}
ol.itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:20px 24px 22px 1fr auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;user-select:none}
.item:hover{border-color:var(--line2)}
.item.on{background:var(--panel2);border-color:var(--sel)}
.item.dragging{opacity:.35}
.item.dropBefore{box-shadow:0 -3px 0 var(--sel)}
.item.dropAfter{box-shadow:0 3px 0 var(--sel)}
.grip{color:#6b6b78;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;height:28px}
.num{color:var(--muted);text-align:right}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{color:var(--muted);font-size:12px}
.chip{border-radius:6px;padding:4px 9px;font-size:12px;white-space:nowrap;background:var(--line);color:var(--text)}
.chip.letra{background:var(--blueSoft);color:var(--blueText)}
.chip.midia{background:#3a2a14;color:#f2dfb0}
.warnTxt{color:#f2dfb0}
aside.editor{border-left:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sel)}
.field textarea{min-height:220px;resize:vertical;line-height:1.55}
#cfLista{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;font:inherit;line-height:1.5;resize:vertical}
#cfLista:focus{outline:none;border-color:var(--sel)}
.msg{font-size:12px;line-height:1.45}
.ok{color:#b8f0cd}.bad{color:#ffb4ad}.warn{color:#f2dfb0}
.empty{color:var(--muted);text-align:center;padding:40px 16px;line-height:1.6}
.menu{position:fixed;z-index:50;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:9px 12px;min-height:38px}
.menu button:hover{background:var(--line)}
.menu button.danger{color:#ffb4ad}
.menu hr{border:0;border-top:1px solid var(--line2);margin:5px 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px 16px;z-index:60;max-width:min(520px,90vw);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.live .wrap.rlWrap{display:flex;flex-direction:column;gap:12px;max-width:760px}
.rlCard{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rlCard.feito{opacity:.6}
.rlCab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rlTxt{white-space:pre-wrap;line-height:1.45}
.rlPrint{max-width:100%;max-height:320px;border-radius:6px;border:1px solid var(--line2)}
.rlLog{white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:300px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px;color:var(--muted)}
.dialogBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog.conf{max-width:480px;max-height:85vh;overflow:auto}
.cfList{display:flex;flex-direction:column;gap:2px}
.cfRow{display:flex;align-items:flex-start;gap:10px;padding:7px 4px;border-radius:8px;text-align:left;line-height:1.4;font:inherit;color:var(--text);background:none;border:0;width:100%}
button.cfRow{cursor:pointer}button.cfRow:hover{background:var(--line)}
label.cfRow{cursor:pointer}label.cfRow input{margin:3px 0 0;width:16px;height:16px;flex:0 0 auto}
.cfMark{flex:0 0 18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px}
.cfMark.ok{background:#F2F2F2;border-color:#F2F2F2;color:#141414}
.cfMark.falta{border-color:#A8A8A8}
.cfMark.neutro{border:0;color:var(--muted)}
.dialog{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.dialog .row{display:flex;gap:10px;justify-content:flex-end}
.back{display:none}
@media (max-width: 900px){
  .cols{display:block;overflow:auto}
  .app .col{display:none;overflow:visible}
  .app[data-view="cultos"] nav.cultos{display:flex}
  .app[data-view="roteiro"] main.roteiro{display:flex}
  .app[data-view="item"] aside.editor{display:flex}
  nav.cultos,aside.editor{border:0}
  main.roteiro{padding:16px 14px 90px}
  aside.editor{padding:16px 14px 40px}
  .back{display:inline-flex;align-items:center}
  .item{grid-template-columns:20px 22px 1fr;grid-template-rows:auto auto}
  .item .icon{display:none}
  .item .chip{grid-column:3;justify-self:start}
  .pubBar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px 16px;display:flex;gap:10px;z-index:20}
  .pubBar .btn{min-height:48px;flex:1}
  .headPub{display:none}
}
@media (min-width: 901px){ .pubBar{display:none} }
/* Banco de músicas */
.busca{position:relative}
.bRes{display:flex;flex-direction:column;gap:2px;margin-top:6px;max-height:340px;overflow:auto}
.bRes .sec{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:8px 2px 4px}
.bRes .r{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;text-align:left;background:none;border:0;color:inherit;width:100%}
.bRes .r:hover,.bRes .r:focus{background:var(--panel2)}
.capa{width:44px;height:44px;border-radius:6px;flex:0 0 auto;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.bRes .t{font-weight:600}
.bRes .a,.bRes .l{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bRes mark{background:rgba(255,214,0,.35);color:inherit;border-radius:2px}
.escolhida{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px}
.escolhida .capa{width:64px;height:64px}
.previa{white-space:pre-wrap;font-size:13px;line-height:1.45;color:var(--muted);max-height:240px;overflow:auto;margin-top:6px}
.cand{border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:8px}
.cand .previa{max-height:200px;color:var(--text)}
.cand .acoes{display:flex;gap:8px;flex-wrap:wrap}
/* Equipe e escala */
.eqRow{display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(130px,1fr) minmax(0,2fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.eqRow input{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-height:40px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
/* menu do Diretor (na conta) */
.app.logado header.top{display:none}
.app.logado nav.cultos{padding:14px 10px 12px;gap:2px}
.navLogo{padding:2px 10px 14px;font-size:24px}
.navItem{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 10px;text-align:left;font-weight:600;color:var(--text)}
.navItem:hover{background:var(--panel)}
.navItem.on{background:var(--panel2);border-color:var(--line2)}
.navIc{display:flex;color:var(--muted)}
.navItem.on .navIc{color:var(--text)}
.navNome{flex:1}
.navN{background:var(--line2);border-radius:10px;padding:1px 7px;font-size:12px}
.navSub{display:flex;flex-direction:column;gap:1px;margin:0 0 6px 18px;padding-left:8px;border-left:1px solid var(--line)}
.navSub .culto{padding:6px 9px}
.navSub .culto .t{font-size:13px}
.navSub .culto .s{font-size:11px}
.navNovo{background:transparent;border:0;color:var(--muted);text-align:left;padding:6px 9px;border-radius:8px;font-size:13px}
.navNovo:hover{color:var(--text);background:var(--panel)}
.navPe{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:flex;flex-direction:column;gap:4px}
.navConta{padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navAcoes{display:flex;gap:4px;justify-content:space-between;padding:0 4px}
/* redes sociais */
.redes{display:flex;flex-direction:column;gap:14px}
.semana{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.dia{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;min-height:160px;min-width:0}
.dia.hoje{border-color:var(--sel)}
.diaT{color:var(--muted);font-size:12px;font-weight:600;padding:0 2px}
.post{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px;min-width:0}
.post:hover{border-color:#8c8c8c}
.post.on{border-color:#fff}
.pRede{color:var(--muted);font-size:11px}
.pT{font-weight:600;font-size:13px;overflow-wrap:break-word}
.pE{color:var(--muted);font-size:11px}
.diaMais{margin-top:auto;background:transparent;border:1px dashed transparent;border-radius:8px;color:var(--muted);min-height:28px}
.dia:hover .diaMais{border-color:var(--line2)}
.diaMais:hover{color:var(--text)}
.peca{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.peca .muted{font-size:12px;text-align:right}
.addPeca{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line2);border-radius:10px;padding:10px 12px}
.addPecaT{font-weight:600;font-size:13px}
.addPeca label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px;flex:1;min-width:0}
.addPecaL{display:flex;gap:8px;flex-wrap:wrap}
.addPeca input,.addPeca select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;min-width:0;color:var(--text)}
@media (max-width: 900px){ .semana{grid-template-columns:1fr} .dia{min-height:0} }
/* tela de início */
.cols.inicio{grid-template-columns:260px 1fr}
.cols.inicio aside.editor{display:none}
.brand{cursor:pointer}
.ini{display:flex;flex-direction:column;gap:16px;max-width:980px}
.iniTopo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.iniNome{font-size:24px;font-weight:700;margin-top:2px}
.iniChip{border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--text)}
.iniPend{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.iniPendT{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600}
.iniItem{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.iniItem:last-child{border-bottom:0}
.iniTx{flex:1;min-width:0}
.iniTx .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iniIc{color:var(--muted);display:flex}
.iniIc.urg,.urg{color:var(--red)}
.iniItem .btn{min-height:34px;white-space:nowrap}
.iniOk{padding:16px 14px;color:var(--text)}
.iniGrade{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.iniBloco{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.iniBloco .lblSec{margin-bottom:6px}
.iniLinha{display:flex;justify-content:space-between;gap:10px;background:transparent;border:0;border-radius:6px;padding:6px 6px;margin:0 -6px;text-align:left;font-size:13px}
.iniLinha:hover{background:var(--panel2)}
.iniVazio{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.fchips button{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:4px 10px;font-size:13px}
.fchips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.vaga{display:grid;grid-template-columns:minmax(120px,1fr) minmax(180px,2fr) auto auto auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.vaga select{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px;min-height:40px;width:100%}
.estado{font-size:12px;border-radius:12px;padding:3px 9px;white-space:nowrap}
.estado.pendente{background:rgba(242,184,75,.15);color:#f2b84b}
.estado.confirmado{background:rgba(76,175,80,.18);color:#7bd47f}
.estado.recusado{background:rgba(229,87,77,.18);color:#ff8a80}
.estado.vazio{background:var(--line);color:var(--muted)}
@media (max-width: 900px){ .eqRow,.vaga{grid-template-columns:1fr} }
/* Planejamento */
.abas{display:flex;gap:6px;flex-wrap:wrap}
.abas button{background:var(--panel2);border:1px solid var(--line2);border-radius:18px;padding:6px 14px;font-weight:600}
.abas button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mes .dn{color:var(--muted);font-size:11px;text-transform:uppercase;text-align:center;padding:4px 0}
.mes .dia{min-height:92px;background:var(--panel2);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px;font-size:12px;overflow:hidden}
.mes .dia.fora{opacity:.35}
.mes .dia.hoje{outline:2px solid var(--blue)}
.mes .n{color:var(--muted);font-size:11px}
.tag{display:block;border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;font-size:12px;color:inherit;width:100%}
.tag.culto{background:rgba(60,110,230,.28)}
.tag.evento{background:rgba(156,98,230,.32)}
.tag.marco{background:rgba(156,98,230,.16);border-left:3px solid #9c62e6}
.tag.prazo{background:rgba(242,184,75,.18);border-left:3px solid #f2b84b}
.tag.prazo.atrasada{background:rgba(229,87,77,.2);border-left-color:#e5574d}
.dem{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.dem .t{font-weight:600}
.estado.a_fazer{background:var(--line);color:var(--text)}
.estado.fazendo{background:rgba(60,110,230,.25);color:#9db8ff}
.estado.para_aprovar{background:rgba(242,184,75,.15);color:#f2b84b}
.estado.ajustar{background:rgba(229,87,77,.18);color:#ff8a80}
.estado.pronto{background:rgba(76,175,80,.18);color:#7bd47f}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade2 input,.grade2 select,.planoForm input,.planoForm select,.planoForm textarea{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-height:40px;color:var(--text)}
.planoForm label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.grupo{border-top:1px solid var(--line);padding:10px 0}
.lnk{display:flex;gap:8px;align-items:center;padding:4px 0;flex-wrap:wrap}
.lnk a{color:var(--blueText);font-weight:600;word-break:break-all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lnk select{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;color:var(--text);max-width:260px}
.escolha{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--text);cursor:pointer}
.escolha:hover{border-color:var(--blue)}
.usar{background:rgba(60,110,230,.18);color:#9db8ff;border:1px solid rgba(60,110,230,.5);border-radius:16px;padding:4px 12px;font-weight:600;cursor:pointer;font-size:13px}
.lblSec{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.lblSec .muted{text-transform:none;letter-spacing:0;font-weight:500;margin-left:4px}

.secao,.tarefas{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.tarefa{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.tarefa:hover{border-color:var(--line2)}

.quadro{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;padding:12px 16px 16px;max-width:1300px;width:100%;margin:0 auto;overflow-x:auto;align-items:start}
.coluna{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}

/* Ao vivo */

.live .agora .big{font-size:22px;font-weight:700;line-height:1.25}

.live .chips{display:flex;flex-wrap:wrap;gap:8px}
.live .chips button{background:var(--line);border:0;border-radius:18px;padding:0 14px;min-height:38px;font-weight:600}
.live .chips button.on{background:var(--blue);color:#fff}
.live .chips button.resp{background:var(--panel2);border:1px solid var(--line2)}
.live .send{display:flex;gap:8px}
.live .send input,.live .field input,.live .field select{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
.live .thread{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.live .m{background:var(--panel2);border-radius:10px;padding:8px 11px;max-width:88%;line-height:1.4}
.live .m.eu{align-self:flex-end;background:var(--blueSoft);color:var(--blueText)}
.live .m .w{font-size:11px;opacity:.7;margin-bottom:2px}
.live .sug{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}

@media (max-width: 900px){ .live .wrap{grid-template-columns:1fr;padding:12px} }

/* ---- Identidade somun: por cima das cores antigas ---- */

/* o logo do app: a palavra "un" em Outfit 800 e o ponto vermelho (como "live." e "tela.") */

.estado.a_fazer{background:#2a2a2a;color:#d0d0d0}

.marcoChip{background:#232323;border-left-color:#8c8c8c}
.fchips button.sim{background:#fff;border-color:#fff;color:#141414}

<body>
<!-- Configuração do Firebase (só existe na página publicada no site; sem ela, modo de teste). -->
<script src="firebase-config.js"></script>
<!-- "Relatar problema" (o mesmo da somun cam no navegador). -->
<script src="relatar.js"></script>
<div class="app" id="app" data-view="cultos">
  <header class="top">
    <div class="brand" title="somun Diretor" aria-label="somun Diretor"><span class="nome">un<i></i></span></div>
    <div style="flex:1"></div>
    <div class="muted small" id="modeNote">Modo de teste: os dados ficam só neste navegador</div>
    <button class="btn small" id="btnPlano" style="display:none">Produção</button>
    <button class="btn small" id="btnEquipe" style="display:none">Equipe</button>
    <button class="btn small" id="btnMais" aria-label="Mais opções">⋯</button>
    <button class="btn link small" id="sair" style="display:none">Sair</button>
  </header>
  <div id="login" style="display:none;flex:1;align-items:center;justify-content:center;padding:20px">
    <form id="loginForm" class="dialog" style="max-width:360px">
      <div style="font-weight:700;font-size:18px">Entrar</div>
      <div class="muted small">Conta do somun da sua igreja.</div>
      <div class="field"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" required></div>
      <div class="msg bad" id="lErro"></div>
      <button class="btn primary" type="submit" style="min-height:44px">Entrar</button>
    </form>
  </div>
  <div class="cols">
    <nav class="col cultos" id="cultos" aria-label="Cultos"></nav>
    <main class="col roteiro" id="roteiro"></main>
    <aside class="col editor" id="editor" aria-label="Item escolhido"></aside>
  </div>
  <section class="live" id="aovivo" style="display:none" aria-label="Culto ao vivo"></section>
  <section class="live" id="painel" style="display:none" aria-label="Equipe e escala"></section>
  <section class="live" id="relatos" style="display:none" aria-label="Relatos de problema"></section>
  <section class="live" id="plano" style="display:none" aria-label="Planejamento"></section>
</div>

<script>
(function(){
'use strict';

/* ---------------------------------------------------------------------------
 * Projeto Live — app do Diretor (fase de testes, sem servidor).
 *
 * O diretor monta o culto: nome, data, hora e o roteiro (músicas, leituras,
 * imagens e vídeos), com o destino de cada item (Só telão / Telão + letra na
 * live / Telão + imagem e som na live). Imagens e vídeos são links do Google
 * Drive. "Publicar" guarda uma versão numerada (v1, v2...).
 *
 * Nesta fase os dados ficam no navegador (localStorage). O formato já é o que
 * vai para o Firebase (Firestore): um documento por culto, com os itens e as
 * versões publicadas. Trocar o "store" abaixo é o que liga o app no Firebase.
 * ------------------------------------------------------------------------- */

var KEY = 'projeto-live-diretor-v1';

var TIPOS = {
  musica: {nome: 'Música', destinos: ['letra', 'telao']},
  texto:  {nome: 'Leitura ou texto', destinos: ['letra', 'telao']},
  imagem: {nome: 'Imagem', destinos: ['telao', 'midia']},
  video:  {nome: 'Vídeo', destinos: ['midia', 'telao']}
};
var DESTINOS = {
  telao: {longo: 'Só telão', curto: 'Só telão'},
  letra: {longo: 'Telão + letra na live', curto: 'Letra na live'},
  midia: {longo: 'Telão + imagem e som na live', curto: 'Imagem e som na live'}
};
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
var ICONES = {
  musica: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3ad" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  texto:  '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3ad" stroke-width="1.8"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/></svg>',
  imagem: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3ad" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  video:  '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3ad" stroke-width="1.8"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2"/></svg>'
};
var GRIP = '<svg aria-hidden="true" width="12" height="18" viewBox="0 0 12 18" fill="#6b6b78"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg>';

/* ---------------- dados ---------------- */

var memoria = null; /* se o navegador não deixar guardar, fica só na memória */
var store = {
  load: function(){
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return memoria || {cultos: []};
  },
  save: function(data){
    memoria = data;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {
      document.getElementById('modeNote').textContent = 'Este navegador não deixa guardar: os dados somem ao fechar';
    }
  }
};

var db = store.load();
var ui = {cultoId: null, itemId: null, eventoId: null, tarefaId: null, view: 'cultos'};
try { var lembrado = JSON.parse(localStorage.getItem(KEY + '-ui') || 'null'); if (lembrado) { ui.cultoId = lembrado.cultoId; } } catch (e) {}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function salvar(){
  store.save(db);
  try { localStorage.setItem(KEY + '-ui', JSON.stringify({cultoId: ui.cultoId})); } catch (e) {}
  if (nuvem.user && ui.cultoId) nuvem.agendar(ui.cultoId);
}

/* ---------------- conta (Firebase) ----------------
 * Com o arquivo firebase-config.js (só na página publicada no site), o app pede login e guarda
 * os cultos no Firestore, coleção "cultos", um documento por culto (dono = a conta). A última
 * versão publicada vai inteira no campo "ultima", que é o que a Projeção lê; o histórico das
 * versões fica em cultos/<id>/versoes/<n>. Sem o arquivo, segue o modo de teste no navegador. */
var FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
var nuvem = {
  user: null, fs: null, auth: null, m: null, timers: {},
  agendar: function(id){
    clearTimeout(nuvem.timers[id]);
    aviso('Salvando…');
    nuvem.timers[id] = setTimeout(function(){ nuvem.enviar(id); }, 700);
  },
  dados: function(c){
    return {owner: nuvem.user.uid, nome: c.nome || '', data: c.data || '', hora: c.hora || '', itens: c.itens, conferido: c.conferido || {}, ultima: ultima(c) || null, atualizadoEm: new Date().toISOString()};
  },
  enviar: function(id, depois){
    var c = db.cultos.find(function(k){ return k.id === id; }); if (!c || !nuvem.user) return;
    clearTimeout(nuvem.timers[id]);
    nuvem.m.setDoc(nuvem.m.doc(nuvem.fs, 'cultos', id), nuvem.dados(c)).then(function(){ aviso('Salvo'); if (depois) depois(); }, function(e){ aviso('Sem conexão: salvo neste aparelho, envia quando voltar'); console.warn(e); });
  },
  versao: function(c, v){
    if (!nuvem.user) return;
    nuvem.m.setDoc(nuvem.m.doc(nuvem.fs, 'cultos', c.id, 'versoes', String(v.n)), {owner: nuvem.user.uid, n: v.n, em: v.em, retrato: v.retrato}).catch(function(e){ console.warn(e); });
  },
  apagar: function(id){
    if (!nuvem.user) return;
    nuvem.m.deleteDoc(nuvem.m.doc(nuvem.fs, 'cultos', id)).catch(function(e){ console.warn(e); });
  }
};
function aviso(t){ var n = document.getElementById('modeNote'); if (n && nuvem.user) n.textContent = nuvem.user.email + ' · ' + t; var m = document.getElementById('navConta'); if (m && n) m.textContent = n.textContent; }

function telaLogin(mostrar){
  document.getElementById('app').classList.toggle('logado', !mostrar);
  document.getElementById('login').style.display = mostrar ? 'flex' : 'none';
  document.querySelector('.cols').style.display = mostrar ? 'none' : '';
  document.getElementById('sair').style.display = mostrar ? 'none' : '';
  document.getElementById('btnEquipe').style.display = mostrar ? 'none' : '';
  document.getElementById('btnPlano').style.display = mostrar ? 'none' : '';
}

function iniciarNuvem(cfg){
  telaLogin(true);
  document.getElementById('modeNote').textContent = 'Conectando…';
  Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')]).then(function(mods){
    var app = mods[0].initializeApp(cfg), A = mods[1], F = mods[2];
    nuvem.m = F; nuvem.auth = A.getAuth(app);
    try { nuvem.fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache()}); } catch (e) { nuvem.fs = F.getFirestore(app); }
    document.getElementById('modeNote').textContent = '';
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var erro = document.getElementById('lErro'); erro.textContent = '';
      A.signInWithEmailAndPassword(nuvem.auth, document.getElementById('lEmail').value.trim(), document.getElementById('lSenha').value).catch(function(err){
        var c = String(err && err.code || '');
        erro.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? 'E-mail ou senha errados.' :
          /network/.test(c) ? 'Sem internet agora.' : /too-many/.test(c) ? 'Muitas tentativas. Espere um pouco e tente de novo.' : 'Não deu para entrar (' + c + ').';
      });
    });
    document.getElementById('sair').addEventListener('click', function(){ A.signOut(nuvem.auth); });
    A.onAuthStateChanged(nuvem.auth, function(user){
      nuvem.user = user;
      if (!user) { relatos.fechar(); aoVivo.fechar(); banco.parar(); equipe.parar(); plano.parar(); db = {cultos: []}; ui.cultoId = null; ui.itemId = null; ui.eventoId = null; ui.tarefaId = null; ui.view = 'cultos'; telaLogin(true); document.getElementById('modeNote').textContent = ''; render(); return; }
      telaLogin(false); aviso('Carregando…');
      // somun hub (25/11): sinal de vida do Diretor (quando foi usado), para o painel de administração
      F.setDoc(F.doc(nuvem.fs, 'sinais', user.uid), {email: user.email || '', diretor: {em: F.serverTimestamp()}}, {merge: true}).catch(function(){});
      banco.ouvir(); equipe.ouvir(); plano.ouvir(); conf.carregar();
      F.getDocs(F.query(F.collection(nuvem.fs, 'cultos'), F.where('owner', '==', user.uid))).then(function(snap){
        var lista = [];
        snap.forEach(function(d){
          var x = d.data();
          lista.push({id: d.id, nome: x.nome || '', data: x.data || '', hora: x.hora || '', itens: x.itens || [], conferido: x.conferido || {}, versoes: x.ultima ? [x.ultima] : []});
        });
        var teste = null;
        try { teste = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
        db = {cultos: lista};
        if (!ui.cultoId || !culto()) ui.cultoId = null;
        /* Sem culto escolhido abre na tela de início (também no celular). */
        if (!ui.cultoId || innerWidth > 900) ui.view = 'roteiro';
        aviso('Salvo'); render();
        /* Primeira vez na conta: oferece levar os cultos do modo de teste deste navegador. */
        if (!lista.length && teste && teste.cultos && teste.cultos.length) {
          dialogo('Levar os cultos de teste para a conta?', 'Este navegador tem ' + teste.cultos.length + (teste.cultos.length === 1 ? ' culto' : ' cultos') + ' do modo de teste.', 'Levar para a conta', function(){
            teste.cultos.forEach(function(c){ db.cultos.push(c); nuvem.enviar(c.id, function(){ var u = ultima(c); if (u) nuvem.versao(c, u); }); });
            render();
          });
        }
      }, function(e){ aviso('Não deu para carregar (' + (e && e.code || 'erro') + ')'); console.warn(e); });
    });
  }, function(e){
    document.getElementById('modeNote').textContent = 'Sem internet: não deu para abrir a conta';
    console.warn(e);
  });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function culto(){ return db.cultos.find(function(c){ return c.id === ui.cultoId; }) || null; }
function item(){ var c = culto(); return c ? (c.itens.find(function(i){ return i.id === ui.itemId; }) || null) : null; }

function proximoDomingo(){
  var d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseData(s){ var p = (s || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
function dataCurta(c){
  var d = parseData(c.data); if (!d) return 'sem data';
  return DIAS[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + (c.hora ? ' · ' + c.hora.replace(':00', 'h').replace(':', 'h') : '');
}
function quando(iso){
  var d = new Date(iso);
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + 'h' + String(d.getMinutes()).padStart(2, '0');
}

/* O que vai numa versão: o culto como está agora, sem as versões antigas. */
function retrato(c){ return {nome: c.nome, data: c.data, hora: c.hora, itens: JSON.parse(JSON.stringify(c.itens))}; }
function ultima(c){ return c.versoes.length ? c.versoes[c.versoes.length - 1] : null; }
function mudou(c){ var u = ultima(c); return !u || JSON.stringify(u.retrato) !== JSON.stringify(retrato(c)); }
function situacao(c){
  var u = ultima(c);
  if (!u) return {cor: '#6b6b78', texto: 'Rascunho · ainda não publicado', curto: 'rascunho'};
  if (mudou(c)) return {cor: 'var(--amber)', texto: 'Alterações não publicadas · última versão: v' + u.n + ', ' + quando(u.em), curto: 'v' + u.n + ' + alterações'};
  return {cor: 'var(--green)', texto: 'Publicado v' + u.n + ' · ' + quando(u.em), curto: 'v' + u.n + ' publicada'};
}

/* Link do Google Drive: tira o id do arquivo. Pasta não serve (a Projeção baixa um arquivo). */
function lerDrive(link){
  link = (link || '').trim();
  if (!link) return {estado: 'vazio'};
  if (!/^https?:\/\/(drive|docs)\.google\.com\//i.test(link)) return {estado: 'naoDrive'};
  if (/\/folders\//.test(link)) return {estado: 'pasta'};
  var m = link.match(/\/d\/([A-Za-z0-9_-]{15,})/) || link.match(/[?&]id=([A-Za-z0-9_-]{15,})/);
  return m ? {estado: 'ok', id: m[1]} : {estado: 'naoDrive'};
}
function slides(texto){ return (texto || '').split(/\n\s*\n/).filter(function(s){ return s.trim(); }).length; }
/* Horário previsto do item: a hora do culto mais os minutos dos itens de antes (vazio se algum
 * item de antes não tem duração). A mesa do somun live usa a mesma conta. */
function horaItem(c, i){
  if (!c || !/^\d\d:\d\d$/.test(c.hora || '')) return '';
  var t = parseInt(c.hora.slice(0, 2), 10) * 60 + parseInt(c.hora.slice(3, 5), 10);
  for (var n = 0; n < c.itens.length && c.itens[n] !== i; n++) { if (!(c.itens[n].min > 0)) return ''; t += c.itens[n].min; }
  t = t % (24 * 60);
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}
function resumo(i){
  var hh = horaItem(culto(), i);
  return (hh ? hh + (i.min > 0 ? ' · ' + i.min + ' min' : '') + ' · ' : '') + resumoTipo(i);
}
function resumoTipo(i){
  var t = TIPOS[i.tipo].nome;
  if (i.tipo === 'musica' && i.musicaId) return t + ' · do banco da igreja' + (i.artista ? ' · ' + esc(i.artista) : '');
  if (i.tipo === 'musica' || i.tipo === 'texto') { var n = slides(i.letra); return t + ' · ' + (n ? n + (n === 1 ? ' slide' : ' slides') : (i.tipo === 'musica' ? 'da biblioteca da Projeção' : 'sem texto ainda')); }
  var d = lerDrive(i.link);
  if (d.estado === 'ok') return t + ' · arquivo do Drive';
  return t + ' · <span class="warnTxt">falta o link do arquivo</span>';
}

/* ---------------- telas ---------------- */

function render(){
  document.getElementById('app').dataset.view = ui.view;
  var casa = emInicio();
  /* Na tela de início o painel do meio ocupa também a coluna da direita (menos com uma tarefa aberta). */
  document.querySelector('.cols').classList.toggle('inicio', (casa || (nuvem.user && ui.eventoId === 'fixos_' + nuvem.user.uid) || (ui.redes && !ui.postId)) && !ui.tarefaId);
  renderCultos();
  if (ui.redes && nuvem.user) renderRedes(); else if (ui.eventoId && nuvem.user) renderEvento(); else if (casa) renderInicio(); else renderRoteiro();
  renderEditor();
}

/* ---------------- pedir versão vertical num clique (27/11) ----------------
 * Item do culto que vai para a transmissão sem a versão vertical: "Pedir vertical" cria uma tarefa
 * da Produção para quem faz (com o link da arte horizontal de base) e guarda {culto, item} na tarefa
 * (campo paraVertical). Quando o diretor aprova a entrega, o link entra sozinho no item (i.vertical). */
var vert = {
  pedido: function(c, i){
    return plano.demandas.find(function(d){ return d.paraVertical && d.paraVertical.culto === c.id && d.paraVertical.item === i.id && plano.estado(d) !== 'pronto'; }) || null;
  },
  faltando: function(c){
    return c.itens.filter(function(i){ return (i.tipo === 'imagem' || i.tipo === 'video') && i.destino === 'midia' && lerDrive(i.link).estado === 'ok' && lerDrive(i.vertical).estado !== 'ok'; });
  },
  /* Janela: quem faz e até quando; uma tarefa por item. */
  pedir: function(cultoId, itemIds){
    var c = plano.cultoDe(cultoId); if (!c) return;
    var itens = c.itens.filter(function(i){ return itemIds.indexOf(i.id) >= 0 && !vert.pedido(c, i); });
    if (!itens.length) { toast('Já foi pedida.'); return; }
    var prazo = c.data ? iso(new Date(new Date(c.data + 'T12:00').getTime() - 2 * 864e5)) : '';
    if (prazo && prazo < hojeISO()) prazo = hojeISO();
    var ultimo = ''; try { ultimo = localStorage.getItem(KEY + '-vertPessoa') || ''; } catch (e) {}
    if (!equipe.pessoa(ultimo)) ultimo = (equipe.pessoas.find(function(p){ return (p.funcoes || []).some(function(f){ return /design|arte/i.test(f); }); }) || {}).id || '';
    var bg = document.createElement('div'); bg.className = 'dialogBg';
    bg.innerHTML = '<div class="dialog" role="dialog" aria-modal="true"><div style="font-weight:700;font-size:16px">Pedir versão vertical</div>' +
      '<div class="muted small" style="line-height:1.5">' + itens.map(function(i){ return esc(i.titulo || TIPOS[i.tipo].nome); }).join(' · ') + ' · ' + esc(c.nome || 'Culto') + '</div>' +
      '<label class="muted small" style="display:flex;flex-direction:column;gap:4px">Quem faz<select id="vtP" style="background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;color:var(--text)"><option value="">— ninguém (fica na Produção) —</option>' +
        equipe.pessoas.map(function(p){ return '<option value="' + esc(p.id) + '"' + (p.id === ultimo ? ' selected' : '') + '>' + esc(p.nome || 'Sem nome') + '</option>'; }).join('') + '</select></label>' +
      '<label class="muted small" style="display:flex;flex-direction:column;gap:4px">Entregar até<input id="vtD" type="date" value="' + esc(prazo) + '" style="background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;color:var(--text);color-scheme:dark"></label>' +
      '<div class="muted small">Vai com o link da arte horizontal. Quando você aprovar a entrega, o link vertical entra sozinho no item.</div>' +
      '<div class="row"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Pedir</button></div></div>';
    document.body.appendChild(bg);
    bg.querySelector('[data-x]').onclick = function(){ bg.remove(); };
    bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
    bg.querySelector('[data-ok]').onclick = function(){
      var quem = bg.querySelector('#vtP').value, ate = bg.querySelector('#vtD').value; bg.remove();
      try { if (quem) localStorage.setItem(KEY + '-vertPessoa', quem); } catch (e) {}
      itens.forEach(function(i, k){
        var d = {titulo: 'Versão vertical: ' + (i.titulo || TIPOS[i.tipo].nome), tipo: i.tipo === 'video' ? 'Vídeo' : 'Arte', culto: c.id, pessoa: quem, prazo: ate,
          obs: 'Versão vertical (9:16) desta arte: ' + i.link, paraVertical: {culto: c.id, item: i.id}};
        /* Só a primeira pergunta se avisa no WhatsApp (uma mensagem por pedido). */
        if (k === 0) plano.novaTarefa(d); else plano.salvarDemanda(Object.assign({id: uid(), evento: '', post: '', estado: 'a_fazer', criadoEm: new Date().toISOString()}, d), null);
      });
      toast(itens.length === 1 ? 'Pedida para ' + (quem ? inicio.nome(quem) : 'a Produção') + '.' : itens.length + ' versões pedidas para ' + (quem ? inicio.nome(quem) : 'a Produção') + '.');
      render();
    };
  },
  /* Aprovou a entrega: o link vai para o item do culto. */
  aprovada: function(d){
    if (!d.paraVertical) return '';
    var en = plano.entrega(d), c = plano.cultoDe(d.paraVertical.culto), i = c && c.itens.find(function(x){ return x.id === d.paraVertical.item; });
    if (!en || !en.url || !i) return '';
    if (lerDrive(en.url).estado !== 'ok') return ' O link entregue não é de arquivo do Drive: cole a versão vertical no item à mão.';
    i.vertical = en.url; store.save(db); if (nuvem.user) nuvem.agendar(c.id);
    if (ui.cultoId === c.id) { renderRoteiro(); renderEditor(); }
    return ' A versão vertical entrou em "' + (i.titulo || 'item') + '". Publique o culto para ir ao somun tela.';
  }
};

/* ---------------- tela de início "Pronto para o culto?" (26/11) ----------------
 * O Diretor abre aqui (sem culto nem evento escolhido). Responde: o próximo culto está pronto? o
 * que precisa de mim? o que vem aí? Cada pendência tem um botão que leva para onde se resolve.
 * Só equipe de mídia (transmissão, tela, foto, vídeo, design). Vermelho só no que é urgente. */
var DIAS_LONGOS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
function emInicio(){ return !!nuvem.user && !ui.cultoId && !ui.eventoId && !ui.redes; }
var inicio = {
  dias: function(data){
    var n = Math.round((new Date(data + 'T12:00') - new Date(hojeISO() + 'T12:00')) / 864e5);
    return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : 'em ' + n + ' dias';
  },
  proximo: function(){
    var hoje = hojeISO();
    /* Culto de hoje deixa de ser o próximo 4 horas depois do horário (já aconteceu). */
    return db.cultos.filter(function(c){ return c.data && c.data >= hoje && !inicio.acabou(c); })
      .sort(function(a, b){ return (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || '')); })[0] || null;
  },
  acabou: function(c){
    var agora = new Date();
    return c.data === hojeISO() && /^\d\d:\d\d$/.test(c.hora || '') && agora.getHours() * 60 + agora.getMinutes() > parseInt(c.hora.slice(0, 2), 10) * 60 + parseInt(c.hora.slice(3, 5), 10) + 240;
  },
  anterior: function(){
    var hoje = hojeISO();
    var prox = inicio.proximo();
    return db.cultos.filter(function(c){ return c.data && c.data <= hoje && (!prox || c.id !== prox.id) && (c.data < hoje || !prox || prox.data > hoje || c.hora < prox.hora); }).sort(function(a, b){ return (b.data + (b.hora || '')).localeCompare(a.data + (a.hora || '')); })[0] || null;
  },
  nome: function(id){ var p = equipe.pessoa(id); return p ? (p.nome || '').split(' ')[0] : ''; },
  /* O que precisa do diretor: [{icone, texto, sub, botao, acao, dados, urgente, principal}] */
  pendencias: function(c){
    var l = [], hoje = hojeISO();
    if (c) {
      var semVertical = [], semArquivo = [];
      c.itens.forEach(function(i){
        var nome = i.titulo || TIPOS[i.tipo].nome;
        if (i.tipo === 'imagem' || i.tipo === 'video') {
          if (lerDrive(i.link).estado !== 'ok') semArquivo.push({i: i, nome: nome});
          else if (i.destino === 'midia' && lerDrive(i.vertical).estado !== 'ok') semVertical.push({i: i, nome: nome});
        } else if (i.tipo === 'texto' && !(i.letra || '').trim()) semArquivo.push({i: i, nome: nome});
      });
      if (!c.itens.length) l.push({icone: 'list', texto: 'Roteiro vazio', sub: 'Monte o roteiro do culto', botao: 'Abrir roteiro', acao: 'culto', dados: c.id});
      var aPedir = semVertical.filter(function(x){ return !vert.pedido(c, x.i); });
      if (aPedir.length) l.push({icone: 'mobile', texto: aPedir.length === 1 ? '1 item sem versão vertical' : aPedir.length + ' itens sem versão vertical',
        sub: aPedir.map(function(x){ return x.nome; }).join(' · '), botao: 'Pedir vertical', acao: 'pedirVertical', dados: c.id + '|' + aPedir.map(function(x){ return x.i.id; }).join(','), principal: true});
      if (semArquivo.length) l.push({icone: 'file', texto: semArquivo.length === 1 ? '1 item sem arquivo ou texto' : semArquivo.length + ' itens sem arquivo ou texto',
        sub: semArquivo.map(function(x){ return x.nome; }).join(' · '), botao: 'Abrir', acao: 'item', dados: c.id + '|' + semArquivo[0].i.id});
      if (equipe.pessoas.length) {
        var vagas = equipe.vagas(c), ocupados = vagas.filter(function(v){ return v.pessoa; }).map(function(v){ return v.pessoa; });
        vagas.forEach(function(v){
          var est = equipe.estado(c, v);
          if (est === 'vazio') {
            var livres = equipe.pessoas.filter(function(p){ return (p.funcoes || []).indexOf(v.funcao) >= 0 && (p.indisponivel || []).indexOf(c.data) < 0 && ocupados.indexOf(p.id) < 0; }).length;
            l.push({icone: 'users', texto: v.funcao + ' sem ninguém', sub: livres ? (livres === 1 ? '1 pessoa livre que faz ' : livres + ' pessoas livres que fazem ') + v.funcao.toLowerCase() : 'Ninguém livre que faz ' + v.funcao.toLowerCase(),
              botao: 'Escalar', acao: 'escala', dados: c.id, urgente: true});
          } else if (est === 'recusado') {
            var p = equipe.pessoa(v.pessoa), r = p && (p.respostas || {})[equipe.chave(c, v)];
            l.push({icone: 'users', texto: inicio.nome(v.pessoa) + ' não pode (' + v.funcao + ')', sub: r && r.motivo ? r.motivo : 'Escolha outra pessoa', botao: 'Trocar', acao: 'escala', dados: c.id, urgente: true});
          }
        });
      }
    }
    plano.demandas.forEach(function(d){
      var est = plano.estado(d);
      if (est === 'para_aprovar') l.push({icone: 'check', texto: d.titulo + ' esperando aprovação', sub: (inicio.nome(d.pessoa) || 'Alguém') + ' mandou' + (plano.origem(d) ? ' · ' + plano.origem(d) : ''), botao: 'Ver', acao: 'tarefa', dados: d.id});
      else if (est !== 'pronto' && d.prazo && d.prazo < hoje) l.push({icone: 'clock', texto: d.titulo + ' atrasada', sub: (inicio.nome(d.pessoa) || 'Sem responsável') + ' · prazo ' + d.prazo.slice(8, 10) + '/' + d.prazo.slice(5, 7), botao: 'Ver', acao: 'tarefa', dados: d.id, urgente: true});
    });
    var em3 = iso(new Date(Date.now() + 3 * 864e5)), sete = iso(new Date(Date.now() - 7 * 864e5));
    redes.posts.forEach(function(po){
      var ep = redes.estado(po);
      if (ep === 'publicado' || !po.data) return;
      var quandoP = po.data === hoje ? 'hoje' : DIAS[new Date(po.data + 'T12:00').getDay()];
      if (po.data < hoje && po.data >= sete) l.push({icone: 'send', texto: 'Post "' + po.titulo + '" não foi marcado como publicado', sub: 'Era para ' + po.data.slice(8, 10) + '/' + po.data.slice(5, 7), botao: 'Ver', acao: 'post', dados: po.id, urgente: true});
      else if (po.data >= hoje && po.data <= em3 && ep !== 'pronto') l.push({icone: 'check', texto: 'Post de ' + quandoP + ': ' + po.titulo, sub: ESTADO_POST[ep] + ' · ' + (po.redes || []).map(function(r){ return redes.rede(r).nome; }).join(', '), botao: 'Ver', acao: 'post', dados: po.id});
    });
    if (c && c.itens.length) {
      var u = ultima(c);
      if (!u || mudou(c)) l.push({icone: 'send', texto: u ? 'Mudou depois da v' + u.n + ': falta publicar' : 'Ainda não publicado', sub: 'O somun tela recebe quando você publica', botao: 'Abrir roteiro', acao: 'culto', dados: c.id});
    }
    return l;
  },
  ICONES: {
    mobile: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>',
    users: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><path d="M16 5.2a3 3 0 0 1 0 5.6M17.5 14.6c1.6.5 2.7 1.9 3 4.4"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
    clock: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    file: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-10z"/><path d="M14 3.5v5h5"/></svg>',
    list: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
    send: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 3.5 10 14M20.5 3.5 14 20.5l-4-6.5-6.5-4z"/></svg>'
  },
  /* Etiquetas do andamento do culto. */
  etiquetas: function(c){
    var t = [];
    t.push(c.itens.length ? 'Roteiro ✓ · ' + c.itens.length + (c.itens.length === 1 ? ' item' : ' itens') : 'Roteiro vazio');
    if (equipe.pessoas.length) {
      var vagas = equipe.vagas(c), cheias = vagas.filter(function(v){ var e = equipe.estado(c, v); return e !== 'vazio' && e !== 'recusado'; }).length;
      t.push('Escala ' + cheias + '/' + vagas.length);
    }
    var midia = c.itens.filter(function(i){ return (i.tipo === 'imagem' || i.tipo === 'video') && i.destino === 'midia'; });
    if (midia.length) { var nPed = midia.filter(function(i){ return lerDrive(i.vertical).estado !== 'ok' && vert.pedido(c, i); }).length;
      t.push('Verticais ' + midia.filter(function(i){ return lerDrive(i.vertical).estado === 'ok'; }).length + '/' + midia.length + (nPed ? ' · ' + nPed + ' pedida' + (nPed === 1 ? '' : 's') : '')); }
    var arq = c.itens.filter(function(i){ return i.tipo === 'imagem' || i.tipo === 'video'; });
    if (arq.length) t.push('Arquivos ' + arq.filter(function(i){ return lerDrive(i.link).estado === 'ok'; }).length + '/' + arq.length);
    var u = ultima(c);
    t.push(!u ? 'Não publicado' : mudou(c) ? 'v' + u.n + ' + alterações' : 'Publicado v' + u.n);
    return t;
  },
  posCulto: function(){
    var c = inicio.anterior(); if (!c) return '';
    var l = plano.tarefasDe('culto', c.id);
    var h = '<div class="iniBloco"><div class="lblSec">Pós-culto · ' + esc(c.nome || 'Culto') + ' ' + esc(c.data.slice(8, 10) + '/' + c.data.slice(5, 7)) + '</div>';
    if (!l.length) h += '<div class="muted small">Nenhuma tarefa de depois do culto (fotos, cortes). Crie no roteiro desse culto.</div>';
    l.slice(0, 5).forEach(function(d){
      var est = plano.estado(d);
      h += '<button class="iniLinha" data-ini="tarefa" data-d="' + esc(d.id) + '"><span>' + esc(d.titulo) + '</span><span class="muted">' + (est === 'pronto' ? '✓ ' : '') + esc((inicio.nome(d.pessoa) || 'sem responsável') + (est === 'pronto' ? '' : ' · ' + (ESTADO_DEMANDA[est] || est).toLowerCase())) + '</span></button>';
    });
    return h + '</div>';
  },
  nasRedes: function(){
    var hoje = hojeISO(), ate = iso(new Date(Date.now() + 6 * 864e5));
    var l = redes.posts.filter(function(p){ return p.data && p.data >= hoje && p.data <= ate; }).sort(function(a, b){ return (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || '')); });

/* Agenda: cultos e eventos juntos. Primeiro os próximos (do mais perto ao mais longe), depois os anteriores. */
function renderCultos(){
  var el = document.getElementById('cultos'), hoje = hojeISO();
  var coisas = db.cultos.map(function(c){ return {tipo: 'culto', x: c, data: c.data || '', ate: c.data || ''}; });
  if (nuvem.user) plano.eventos.forEach(function(e){ if (!e.fixo) coisas.push({tipo: 'evento', x: e, data: e.inicio || '', ate: e.fim || e.inicio || ''}); });
  var prox = coisas.filter(function(k){ return !k.data || k.ate >= hoje; }).sort(function(a, b){ return (a.data || '9').localeCompare(b.data || '9'); });
  var ant = coisas.filter(function(k){ return k.data && k.ate < hoje; }).sort(function(a, b){ return b.data.localeCompare(a.data); });
  var h = nuvem.user ? '' : '<button class="btn" id="novoCulto" style="text-align:left;min-height:44px">+ Novo culto</button>';
  var linha = function(k){
    if (k.tipo === 'culto') {
      var c = k.x, nt = nuvem.user ? plano.pendentes(plano.tarefasDe('culto', c.id)) : 0;
      return '<button class="culto' + (c.id === ui.cultoId && !ui.eventoId ? ' on' : '') + '" data-culto="' + c.id + '">' +
        '<div class="t">' + esc(c.nome || 'Sem nome') + '</div>' +
        '<div class="s">' + esc(dataCurta(c)) + ' · ' + esc(situacao(c).curto) + (nt ? ' · ' + nt + ' tarefa' + (nt === 1 ? '' : 's') : '') + '</div></button>';
    }
    var e = k.x, l = plano.tarefasDe('evento', e.id), ap = l.filter(function(d){ return plano.estado(d) === 'para_aprovar'; }).length, ab = plano.pendentes(l);
    var dt = e.inicio ? e.inicio.slice(8, 10) + '/' + e.inicio.slice(5, 7) + (e.fim && e.fim !== e.inicio ? ' a ' + e.fim.slice(8, 10) + '/' + e.fim.slice(5, 7) : '') : 'Sem data';
    return '<button class="culto ev' + (e.id === ui.eventoId ? ' on' : '') + '" data-evento="' + e.id + '">' +
      '<div class="t"><span class="evTag">Evento</span>' + esc(e.nome) + '</div>' +
      '<div class="s">' + esc(dt) + (ab ? ' · ' + ab + ' tarefa' + (ab === 1 ? '' : 's') : '') + (ap ? ' · <span class="warnTxt">' + ap + ' para aprovar</span>' : '') + '</div></button>';
  };
  if (nuvem.user) { el.innerHTML = menuDiretor(prox, ant, linha); if (emInicio() && document.getElementById('iniBox')) renderInicio(); return; }
  var mes = null;
  var bloco = function(l){ l.forEach(function(k){
    var d = parseData(k.data), m = d ? MESES[d.getMonth()] + ' ' + d.getFullYear() : 'sem data';
    if (m !== mes) { mes = m; h += '<div class="month">' + esc(m) + '</div>'; }
    h += linha(k);
  }); };
  if (nuvem.user && ant.length) h += '<div class="lblSec" style="margin:14px 6px 0">Próximos</div>';
  bloco(prox);
  if (!prox.length && ant.length) h += '<div class="empty small" style="padding:16px">Nada marcado daqui para frente.</div>';
  if (ant.length) { mes = null; h += '<div class="lblSec" style="margin:22px 6px 0">Anteriores</div>'; bloco(ant); }
  if (!coisas.length) h += '<div class="empty small">Nada na agenda ainda.<br>Comece em "+ Novo".</div>';
  el.innerHTML = h;
  if (emInicio() && document.getElementById('iniBox')) renderInicio();
}

/* ---------------- redes sociais (26/11) ----------------
 * Planejamento e produção de conteúdo para qualquer rede (não só o que vai ao vivo).
 * posts/<id>: {owner, titulo, redes[ids], formato, data, hora, legenda, estado (ideia|pronto, só sem
 *   peças), publicado{rede: quando}, criadoEm}. As peças (arte, vídeo, capa) são tarefas da Produção
 *   com o campo post = <id>: a pessoa entrega pelo link pessoal e o diretor aprova; o post fica
 *   "pronto" sozinho quando todas as peças estão aprovadas. Aqui a semana mostra o DIA DE POSTAR; a
 *   Produção mostra o PRAZO de cada peça (que nasce 3 dias antes da postagem).
 * Publicar sozinho nas redes não dá (API da Meta/TikTok pede app aprovado e servidor): a pessoa
 * publica pelo app da rede e marca "publicado" aqui. */
var REDES = [
  {id: 'instagram', nome: 'Instagram', curto: 'IG', formatos: ['Feed', 'Carrossel', 'Reels', 'Stories']},
  {id: 'youtube', nome: 'YouTube', curto: 'YT', formatos: ['Vídeo', 'Shorts', 'Ao vivo']},
  {id: 'tiktok', nome: 'TikTok', curto: 'TT', formatos: ['Vídeo']},
  {id: 'facebook', nome: 'Facebook', curto: 'FB', formatos: ['Post', 'Vídeo', 'Stories']}
];

var PRAZO_ANTES = 3;

  posts: [], extras: [], filtro: '', carregouExtras: false,
  todas: function(){ return REDES.concat(redes.extras.map(function(n){ return {id: 'x_' + semAcento(n).replace(/\s+/g, '_'), nome: n, curto: n.slice(0, 2).toUpperCase(), formatos: ['Post', 'Vídeo']}; })); },
  rede: function(id){ return redes.todas().find(function(r){ return r.id === id; }) || {id: id, nome: id, curto: id.slice(0, 2).toUpperCase(), formatos: []}; },
  post: function(id){ return redes.posts.find(function(p){ return p.id === id; }) || null; },
  pecas: function(p){ return plano.demandas.filter(function(d){ return d.post === p.id; }); },
  estado: function(p){
    var rs = p.redes || [], pub = p.publicado || {};
    if (rs.length && rs.every(function(r){ return pub[r]; })) return 'publicado';
    var l = redes.pecas(p);
    if (l.length) {
      var es = l.map(function(d){ return plano.estado(d); });
      if (es.every(function(e){ return e === 'pronto'; })) return 'pronto';
      if (es.some(function(e){ return e === 'para_aprovar'; })) return 'para_aprovar';
      return 'produzindo';
    }
    return p.estado === 'pronto' ? 'pronto' : 'ideia';
  },
  atrasada: function(p){ var hoje = hojeISO(); return redes.pecas(p).some(function(d){ return d.prazo && d.prazo < hoje && plano.estado(d) !== 'pronto'; }); },

function pedirTexto(titulo, ajuda, f){
  var bg = document.createElement('div'); bg.className = 'dialogBg';
  bg.innerHTML = '<div class="dialog" role="dialog" aria-modal="true"><div style="font-weight:700;font-size:16px">' + esc(titulo) + '</div><div class="muted small">' + esc(ajuda) + '</div>' +
    '<input id="dlgTexto" autocomplete="off"><div class="row"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Salvar</button></div></div>';
  document.body.appendChild(bg);
  var campo = bg.querySelector('#dlgTexto'), ok = function(){ var v = campo.value.trim(); bg.remove(); f(v); };
  bg.querySelector('[data-x]').onclick = function(){ bg.remove(); };
  bg.querySelector('[data-ok]').onclick = ok;
  campo.addEventListener('keydown', function(e){ if (e.key === 'Enter') ok(); });
  bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
  campo.focus();
}

/* O que a caixa única da música entendeu: só letra, ou letra + acordes/recados para o retorno. */
function mostrarLetraTipo(i){
  var m = document.getElementById('letraTipo'); if (!m) return;
  var t = i.cifra || '';
  var partes = [];
  if (pareceCifra(t)) partes.push('acordes');
  if (temRecado(t)) partes.push('recados');
  m.textContent = partes.length ? 'Entendi: letra + ' + partes.join(' e ') + '. O telão recebe só a letra; ' + partes.join(' e ') + ' vão para o retorno de palco.' : '';
}
/* Texto da caixa única: com acordes ou recados vira cifra (o telão recebe a letra tirada dela). */
function mudarLetraCifra(i, texto){
  if (nuvem.user && i.musicaId) { i.cifra = texto; return; }
  if (pareceCifra(texto) || temRecado(texto)) { i.cifra = texto; i.letra = cifraParaLetra(texto); }
  else { i.cifra = ''; i.letra = texto; }
}
function mostrarVertical(i){
  var m = document.getElementById('verticalMsg'); if (!m) return;
  var d = lerDrive(i.vertical);
  var t = {vazio: ['warn', 'Sem a versão vertical, a conferência avisa.'], ok: ['ok', 'Arquivo do Drive reconhecido.'], pasta: ['bad', 'Isso é o link de uma pasta. Abra o arquivo e copie o link dele.'], naoDrive: ['bad', 'Não parece um link de arquivo do Google Drive.']}[d.estado];
  m.className = 'msg ' + t[0]; m.textContent = t[1];
}
function mostrarLink(i){
  var m = document.getElementById('linkMsg'); if (!m) return;
  var d = lerDrive(i.link);
  var t = {
    vazio: ['warn', 'Falta o link do arquivo.'],
    ok: ['ok', 'Arquivo do Drive reconhecido.'],
    pasta: ['bad', 'Isso é o link de uma pasta. Abra o arquivo e copie o link dele.'],
    naoDrive: ['bad', 'Não parece um link de arquivo do Google Drive.']
  }[d.estado];
  m.className = 'msg ' + t[0]; m.textContent = t[1];
}

function novoCulto(base, data){
  var c = base ? JSON.parse(JSON.stringify(retrato(base))) : {nome: data ? 'Culto' : 'Culto de domingo', data: data || proximoDomingo(), hora: '19:00', itens: []};
  c.id = uid(); c.versoes = [];
  if (base) { c.nome = base.nome + ' (cópia)'; c.data = proximoDomingo(); c.itens.forEach(function(i){ i.id = uid(); }); }
  db.cultos.push(c); ui.cultoId = c.id; ui.itemId = null; ui.eventoId = null; ui.tarefaId = null; ui.view = 'roteiro';
  salvar(); render();
  var n = document.getElementById('cNome'); if (n) { n.focus(); n.select(); }
}
function novoItem(tipo){
  var c = culto(); if (!c) return;
  var i = {id: uid(), tipo: tipo, titulo: '', destino: TIPOS[tipo].destinos[0], letra: '', link: '', obs: ''};
  c.itens.push(i); ui.itemId = i.id; ui.view = 'item';
  salvar(); render();
  var t = document.getElementById('iTitulo'); if (t) t.focus();
}
function publicar(){
  var c = culto(); if (!c || !mudou(c)) return;
  var faltando = c.itens.filter(function(i){ return (i.tipo === 'imagem' || i.tipo === 'video') && lerDrive(i.link).estado !== 'ok'; });
  var fazer = function(){
    banco.guardarNovas(c);
    var n = (ultima(c) ? ultima(c).n : 0) + 1;
    c.versoes.push({n: n, em: new Date().toISOString(), retrato: retrato(c)});
    salvar();
    /* O histórico da versão só depois do culto estar salvo na conta (as regras conferem o dono nele). */
    if (nuvem.user) nuvem.enviar(c.id, function(){ nuvem.versao(c, ultima(c)); });
    render();
    toast('v' + n + ' publicada. Quando o app estiver ligado ao Firebase, é aqui que a Projeção recebe a versão nova.');
  };
  if (faltando.length) {
    dialogo('Publicar mesmo assim?', faltando.length + (faltando.length === 1 ? ' item está' : ' itens estão') + ' sem um link válido do Google Drive (' +
      faltando.map(function(i){ return esc(i.titulo || TIPOS[i.tipo].nome); }).join(', ') + '). A Projeção vai avisar que falta arquivo.', 'Publicar', fazer);
  } else fazer();
}
/* Enquanto não há servidor: a última versão publicada vira um texto para colar na Projeção
 * ("Cultos do Diretor" › "Colar culto do Diretor"). É o mesmo conteúdo que vai para o Firebase. */
function textoParaProjecao(c){
  var u = ultima(c); if (!u) return '';
  var r = u.retrato;
  return 'PLCULTO1 ' + JSON.stringify({formato: 'projeto-live-culto', cultoId: c.id, nome: r.nome, data: r.data, hora: r.hora, versao: u.n, publicadaEm: u.em, itens: r.itens});
}
function copiarParaProjecao(){
  var c = culto(); if (!c || !ultima(c)) return;
  var texto = textoParaProjecao(c), n = ultima(c).n;
  var aviso = mudou(c) ? ' Atenção: as alterações depois da v' + n + ' não vão junto; publique antes.' : '';
  var manual = function(){
    var bg = document.createElement('div'); bg.className = 'dialogBg';
    bg.innerHTML = '<div class="dialog" role="dialog" aria-modal="true"><div style="font-weight:700;font-size:16px">Copie o texto abaixo</div>' +
      '<div class="muted small">Selecione tudo, copie e cole na Projeção em "Cultos do Diretor".</div>' +
      '<textarea readonly style="width:100%;min-height:140px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;color:var(--text)"></textarea>' +
      '<div class="row"><button class="btn primary" data-x>Pronto</button></div></div>';
    document.body.appendChild(bg);
    var ta = bg.querySelector('textarea'); ta.value = texto; ta.focus(); ta.select();
    bg.querySelector('[data-x]').onclick = function(){ bg.remove(); };
  };
  try {
    navigator.clipboard.writeText(texto).then(function(){
      toast('v' + n + ' copiada. Na Projeção: Projetos › + › Cultos do Diretor › Colar culto do Diretor.' + aviso);
    }, manual);
  } catch (e) { manual(); }
}

function moverItem(id, para){
  var c = culto(); var de = c.itens.findIndex(function(i){ return i.id === id; });
  if (de < 0) return;
  var it = c.itens.splice(de, 1)[0];
  if (para > de) para--;
  c.itens.splice(para, 0, it);
  salvar(); renderRoteiro(); renderEditor(); atualizarStatus();
}

var menuEl = null;
function fecharMenu(){ if (menuEl) { menuEl.remove(); menuEl = null; } }

  fecharMenu();
  menuEl = document.createElement('div'); menuEl.className = 'menu'; menuEl.setAttribute('role', 'menu');
  opcoes.forEach(function(o){
    if (o === '-') { menuEl.appendChild(document.createElement('hr')); return; }
    var b = document.createElement('button'); b.textContent = o.t; b.setAttribute('role', 'menuitem');
    if (o.perigo) b.className = 'danger';
    b.addEventListener('click', function(){ fecharMenu(); o.f(); });
    menuEl.appendChild(b);
  });
  document.body.appendChild(menuEl);
  var r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  menuEl.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  menuEl.querySelector('button').focus();
}
function toast(texto){
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = texto;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 4500);
}
function dialogo(titulo, html, ok, f){

    '<div class="row"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>' + esc(ok) + '</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelector('[data-x]').onclick = function(){ bg.remove(); };
  bg.querySelector('[data-ok]').onclick = function(){ bg.remove(); f(); };
  bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
  bg.querySelector('[data-ok]').focus();

/* ---------------- banco de músicas da igreja (musicas/<id>) ----------------
 * A Projeção sobe a biblioteca dela para a conta; aqui o diretor busca pelo nome ou por um trecho
 * da letra e vê a prévia. Música nova (com a letra colada) entra no banco ao publicar e desce sozinha
 * para a Projeção. A capa e o artista de uma música nova podem vir do catálogo da Apple (iTunes). */
/* A letra de uma cifra (sem as linhas de acordes, tom, capotraste e tablatura), para a busca. */
function cifraParaLetra(cifra){
  var acorde = /^\(?[A-G](#|b)?(maj|min|dim|aug|sus|add|m|M|º|°|\+|-|\d|\(|\)|\/[A-G](#|b)?|#|b)*\)?\*?$/;
  return String(cifra || '').replace(/\r/g, '').split('\n').filter(function(l){
    var t = l.trim();
    if (!t) return true;
    if (/^(tom|capotraste|afina[cç][aã]o)\s*:/i.test(t) || /^\[.*\]/.test(t) || /^[EADGBe]\s*\|/.test(t)) return false;
    var p = t.split(/\s+/);
    return !p.every(function(w){ return acorde.test(w) || w === '|'; });
  }).map(function(l){ return l.trim(); }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
/* Nomes de parte da cifra ("[Refrão]", "[Intro]"...). Outro texto sozinho entre colchetes é recado
 * para os músicos ("[Repete 2x]"), que vai só para o retorno de palco. A Projeção usa a mesma lista. */
var PARTES_CIFRA = /^(intro(ducao)?|refrao|pre[- ]?refrao|verso|estrofe|ponte|bridge|chorus|verse|pre[- ]?chorus|coro|final|outro|solo|interludio|tag|vamp|parte|primeira parte|segunda parte|terceira parte|quarta parte|ending|instrumental|riff|pasagem|passagem)(\s*\d+)?$/i;
function temRecado(texto){
  return String(texto || '').split('\n').some(function(l){
    var m = l.trim().match(/^\[([^\]]+)\]$/);
    if (!m) return false;
    var t = m[1].trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return !PARTES_CIFRA.test(t) && !/^tab\b/i.test(t);
  });
}
/* Tem pelo menos 2 linhas só de acordes? Então é cifra. */
function pareceCifra(texto){
  var acorde = /^\(?[A-G](#|b)?(maj|min|dim|aug|sus|add|m|M|º|°|\+|-|\d|\(|\)|\/[A-G](#|b)?|#|b)*\)?\*?$/;
  var n = 0;
  String(texto || '').split('\n').forEach(function(l){
    var p = l.trim().split(/\s+/).filter(Boolean);
    if (p.length && p.every(function(w){ return acorde.test(w) || /^[|/.-]+$/.test(w); })) n++;
  });
  return n >= 2;
}
function semAcento(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim(); }

          nt: semAcento(x.titulo), na: semAcento(x.artista), nl: semAcento(x.letra)});

      banco.lista = lista; banco.carregado = true;

    }, function(e){ console.warn('banco de músicas', e); banco.semPermissao = /permission/i.test(String(e && e.code || e)); var i = item(); if (i && i.tipo === 'musica') banco.buscar(i); });
  },
  parar: function(){ if (banco.parar_) { try { banco.parar_(); } catch (e) {} } banco.parar_ = null; banco.lista = []; banco.carregado = false; },
  achar: function(id){ return banco.lista.find(function(m){ return m.id === id; }) || null; },
  editor: function(i){
